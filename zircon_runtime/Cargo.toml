[package]
name = "zircon_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime absorption layer for high-level engine subsystems."

[package.metadata.zircon.validation]
test-dependency-roots = [
    "../docs/assets-and-rendering",
    "../docs/cli-and-tooling",
    "../docs/editor-and-tooling",
    "../docs/engine-architecture",
    "../docs/plans/_archive/zircon_runtime",
    "../docs/plans/engine-code-review-findings-2026-06.md",
    "../docs/plans/engine-code-structure-convention.md",
    "../docs/plans/optimize/zircon_runtime/74/2026-08-22-single-template-compiler-authority.md",
    "../docs/plans/performance/01/renderdoc_capture_audit.py",
    "../docs/plans/zircon_plugins",
    "../docs/plans/zircon_runtime",
    "../docs/zircon_hub",
    "../docs/zircon_plugins",
    "../docs/zircon_runtime",
]

[lib]
crate-type = ["rlib", "cdylib"]

[[test]]
name = "runtime_text_multilingual_product_framebuffer"
path = "tests/runtime_text_multilingual_product_framebuffer.rs"
required-features = ["ui"]

[[bin]]
name = "zircon_host_reflection_docs"
path = "src/bin/zircon_host_reflection_docs.rs"
required-features = ["script"]

[[bin]]
name = "zircon_export_validate"
path = "src/bin/zircon_export_validate/main.rs"

[[bin]]
name = "zircon_export_pack"
path = "src/bin/zircon_export_pack/main.rs"

[[bin]]
name = "zircon_shader_prewarm"
path = "src/bin/zircon_shader_prewarm/main.rs"
required-features = ["dynamic-api"]

[[bin]]
name = "zircon_shader_ide_env"
path = "src/bin/zircon_shader_ide_env/main.rs"
required-features = ["graphics"]

[[bin]]
name = "zircon_neutral_mvp_capture"
path = "src/bin/zircon_neutral_mvp_capture.rs"
required-features = ["graphics"]

[[bin]]
name = "zircon_font_sdf_bake"
path = "src/bin/zircon_font_sdf_bake/main.rs"
required-features = ["font-sdf-build-tool"]

[features]
default = ["target-client"]
test-support = []
runtime-ui-integration-tests = []
backend-jolt = []
core-min = []
ai-contracts = []
net-contracts = []
physics-contracts = []
sound-contracts = []
animation = []
diagnostic-log = []
dynamic-api = [
    "animation",
    "diagnostic-log",
    "graphics",
    "navigation",
    "script",
    "ui",
]
graphics = [
    "text",
    "dep:pollster",
    "dep:raw-window-handle",
    "dep:zr_rhi_wgpu",
]
font-sdf-build-tool = ["graphics"]
navigation = []
script = ["diagnostic-log"]
text = [
    "dep:fdsm",
    "dep:fdsm-ttf-parser",
    "dep:fontsdf",
    "dep:glyphon",
    "dep:icu_locale_core",
    "dep:icu_properties",
    "dep:nalgebra",
    "dep:naga",
    "dep:rustybuzz",
    "dep:self_cell",
    "dep:swash",
    "dep:sys-locale",
    "dep:ttf-parser",
    "dep:unicode-linebreak",
    "dep:unicode-bidi",
    "dep:unicode-bidi-mirroring",
    "dep:unicode-normalization",
    "dep:unicode-properties",
    "dep:unicode-script",
    "dep:unicode-segmentation",
    "dep:unicode-vo",
    "dep:wgpu",
    "dep:woff2-patched",
]
ui = ["graphics", "dep:taffy"]
accessibility-accesskit = ["dep:accesskit"]
profiling = ["zr_resource/profiling"]
profiling-chrome = ["profiling"]
profiling-tracy = ["profiling", "dep:tracing-subscriber", "dep:tracing-tracy"]
profiling-memory = ["profiling"]
default-platform = [
    "platform-window",
    "platform-winit",
    "platform-x11",
    "platform-wayland",
    "input-mouse",
    "input-keyboard",
    "input-touch",
    "input-gamepad",
    "gamepad-gilrs",
]
platform-window = []
platform-winit = [
    "platform-window",
    "dep:winit",
    "zr_rhi/platform-winit",
    "zr_rhi_wgpu?/platform-winit",
]
platform-headless = []
platform-x11 = ["platform-winit", "winit/x11"]
platform-wayland = ["platform-winit", "winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita"]
platform-android-game-activity = ["platform-winit", "winit/android-game-activity"]
platform-android-native-activity = ["platform-winit", "winit/android-native-activity"]
platform-web = ["platform-window", "platform-winit"]
input-mouse = []
input-keyboard = []
input-touch = []
input-gestures = []
input-gamepad = []
gamepad-gilrs = ["input-gamepad"]
gamepad-browser = ["input-gamepad"]
target-client = [
    "core-min",
    "ai-contracts",
    "net-contracts",
    "physics-contracts",
    "sound-contracts",
    "animation",
    "diagnostic-log",
    "dynamic-api",
    "graphics",
    "navigation",
    "script",
    "text",
    "ui",
    "default-platform",
]
target-server = [
    "core-min",
    "diagnostic-log",
    "platform-headless",
    "dep:naga",
]
target-editor-host = [
    "core-min",
    "ai-contracts",
    "net-contracts",
    "physics-contracts",
    "sound-contracts",
    "animation",
    "diagnostic-log",
    "dynamic-api",
    "graphics",
    "navigation",
    "script",
    "text",
    "ui",
    "default-platform",
]

[dependencies]
accesskit = { version = "0.22.0", default-features = false, optional = true }
arc-swap.workspace = true
bevy_mikktspace.workspace = true
bincode.workspace = true
blake3.workspace = true
bytemuck.workspace = true
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
crossbeam-channel.workspace = true
crossbeam-utils = "0.8.21"
fdsm = { version = "0.8.0", optional = true }
fdsm-ttf-parser = { version = "0.2.0", optional = true }
fontsdf = { version = "0.5.3", optional = true }
glam.workspace = true
gltf.workspace = true
glyphon = { version = "0.11.0", optional = true }
icu_locale_core = { version = "=2.2.0", features = ["alloc"], optional = true }
icu_properties = { version = "=2.2.0", optional = true }
image.workspace = true
meshopt.workspace = true
naga = { workspace = true, optional = true }
nalgebra = { version = "0.34.1", optional = true }
notify.workspace = true
pollster = { workspace = true, optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
rayon = "1.11.0"
robust = "1.2.0"
ron = "0.12.1"
rustybuzz = { version = "0.20.1", optional = true }
same-file = "1.0.6"
serde.workspace = true
serde_json = "1.0.149"
self_cell = { workspace = true, optional = true }
sha2.workspace = true
swash = { version = "0.2.7", optional = true }
sys-locale = { version = "0.3.2", optional = true }
taffy = { version = "0.10", default-features = false, features = ["std", "block_layout", "flexbox", "grid", "content_size", "taffy_tree"], optional = true }
tobj.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.20", optional = true }
tracing-tracy = { version = "0.11.4", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
unicode-linebreak = { version = "=0.1.5", optional = true }
unicode-bidi = { version = "=0.3.18", optional = true }
unicode-bidi-mirroring = { version = "=0.4.0", optional = true }
unicode-normalization = { version = "=0.1.25", optional = true }
unicode-properties = { version = "=0.1.4", default-features = false, features = ["emoji", "general-category"], optional = true }
unicode-script = { version = "=0.5.8", optional = true }
unicode-segmentation = { version = "=1.13.3", optional = true }
unicode-vo = { version = "=0.1.0", optional = true }
uuid.workspace = true
wgpu = { workspace = true, optional = true }
winit = { workspace = true, default-features = false, optional = true }
woff2-patched = { version = "0.4.0", optional = true }
libloading = "0.9.0"
libm = "0.2.16"
zeroize = "1.8.2"
zstd = "0.13.3"
zip = { version = "9.0.0-pre2", default-features = false, features = ["deflate-flate2"] }
zircon_runtime_interface = { path = "../zircon_runtime_interface" }
zircon_reflect_derive.workspace = true
zircon_runtime_reflection_macros = { path = "reflection_macros" }
zr_math.workspace = true
zr_resource.workspace = true
zr_rhi.workspace = true
zr_rhi_wgpu = { workspace = true, optional = true }

[build-dependencies]
serde.workspace = true
toml.workspace = true

[dev-dependencies]
ttf2woff2 = { version = "0.13.1", default-features = false }
zr_resource = { workspace = true, features = ["test-support"] }
