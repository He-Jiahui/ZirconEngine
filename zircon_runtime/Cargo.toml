[package]
name = "zircon_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime absorption layer for high-level engine subsystems."

[package.metadata.zircon.validation]
test-dependency-roots = [
    "../zircon_plugins",
    "../docs/assets-and-rendering",
    "../docs/cli-and-tooling",
    "../docs/editor-and-tooling",
    "../docs/engine-architecture",
    "../docs/plans/performance/01/renderdoc_capture_audit.py",
    "../docs/zircon_hub",
    "../docs/zircon_plugins",
    "../docs/zircon_runtime",
    "../docs/architecture/runtime-architecture-review-m0.md",
    "../docs/crates/zircon_editor/ui/asset-editor-v2-authoring.md",
    "../docs/crates/zircon_plugins/editor-build-export-desktop.md",
    "../docs/crates/zircon_plugins/plugin-sdk.md",
    "../docs/crates/zircon_runtime/builtin/runtime_modules.md",
    "../docs/crates/zircon_runtime/core/diagnostics/profiling.md",
    "../docs/crates/zircon_runtime/core/modules.md",
    "../docs/crates/zircon_runtime/graphics/pipeline-registration.md",
    "../docs/crates/zircon_runtime/graphics/types/viewport_render_region.md",
    "../docs/crates/zircon_runtime/plugin/bridge.md",
    "../docs/crates/zircon_runtime/scene/ecs.md",
    "../docs/crates/zircon_runtime/structure/module-convention.md",
    "../docs/crates/zircon_runtime/structure/runtime-absorption-evidence.md",
    "../docs/crates/zircon_runtime/text/mod.md",
    "../docs/crates/zircon_runtime/ui/architecture.md",
    "../docs/crates/zircon_runtime/ui/template/pipeline.md",
    "../docs/crates/zircon_runtime/ui/theme.md",
    "../docs/editor/editor-workbench-shell.md",
    "../docs/editor/zui-asset-governance.md",
    "../docs/testing-and-validation/development-conventions.md",
    "../docs/testing-and-validation/milestone-validation-policy.md",
    "../docs/testing-and-validation/runtime-asset-validation-worklist.md",
    "../docs/testing-and-validation/runtime-dependency-validation-worklist.md",
    "../docs/testing-and-validation/runtime-dynamic-api-validation-worklist.md",
    "../docs/testing-and-validation/runtime-ecs-validation-worklist.md",
    "../docs/testing-and-validation/runtime-frame-schedule-validation-worklist.md",
    "../docs/testing-and-validation/runtime-input-validation-worklist.md",
    "../docs/testing-and-validation/runtime-performance-validation-worklist.md",
    "../docs/testing-and-validation/runtime-plugin-validation-worklist.md",
    "../docs/testing-and-validation/runtime-root-surface-validation-worklist.md",
    "../docs/testing-and-validation/runtime-task-validation-worklist.md",
    "../docs/testing-and-validation/runtime-ui-validation-worklist.md",
]

[lib]
crate-type = ["rlib"]

[[test]]
name = "runtime_text_multilingual_product_framebuffer"
path = "tests/runtime_text_multilingual_product_framebuffer.rs"
required-features = ["ui"]

[[bin]]
name = "zircon_host_reflection_docs"
path = "src/bin/zircon_host_reflection_docs.rs"
required-features = ["script"]

[[bin]]
name = "zircon_export_validate"
path = "src/bin/zircon_export_validate/main.rs"
required-features = ["native-host"]

[[bin]]
name = "zircon_export_pack"
path = "src/bin/zircon_export_pack/main.rs"
required-features = ["native-host"]

[[bin]]
name = "zircon_shader_prewarm"
path = "src/bin/zircon_shader_prewarm/main.rs"
required-features = ["dynamic-api"]

[[bin]]
name = "zircon_shader_ide_env"
path = "src/bin/zircon_shader_ide_env/main.rs"
required-features = ["graphics"]

[[bin]]
name = "zircon_neutral_mvp_capture"
path = "src/bin/zircon_neutral_mvp_capture.rs"
required-features = ["graphics"]

[[bin]]
name = "zircon_font_sdf_bake"
path = "src/bin/zircon_font_sdf_bake/main.rs"
required-features = ["font-sdf-build-tool"]

[[bin]]
name = "zircon_package_service"
path = "src/bin/zircon_package_service.rs"
required-features = ["native-host"]

[features]
default = ["target-client"]
dev-dynamic-linking = ["dep:zr_dev_deps_dylib", "zr_dev_deps_dylib/runtime-assets"]
test-support = ["zr_resource/test-support"]
# Opt-in allocation probes; this never installs an allocator in production builds.
memory-validation = []
runtime-ui-integration-tests = []
backend-jolt = []
core-min = []
asset-types = ["core-min"]
# Native asset authoring, filesystem watching, and dynamic plugin hosting are
# outside the portable core and shared framework contracts.
native-host = [
    "core-min",
    "asset-types",
    "dep:base64",
    "dep:bevy_mikktspace",
    "dep:chrono",
    "dep:gltf",
    "dep:goblin",
    "dep:libloading",
    "dep:meshopt",
    "dep:notify",
    "dep:ring",
    "dep:ron",
    "dep:same-file",
    "dep:tobj",
    "dep:zeroize",
    "dep:zip",
    "dep:zstd",
]
ai-contracts = []
net-contracts = []
physics-contracts = []
sound-contracts = []
animation = ["cooked-assets"]
diagnostic-log = []
dynamic-api = [
    "animation",
    "diagnostic-log",
    "graphics",
    "navigation",
    "script",
    "ui",
]
# Build-only boundary aliases.  They are separate from the serialized
# RuntimeProfileId/project feature vocabulary and can be narrowed in future
# without changing existing development profiles.
cooked-assets = ["asset-types"]
graphics-core = ["graphics"]
runtime-api-core = ["dynamic-api"]
shipping-runtime = [
    "native-host",    "cooked-assets",
    "diagnostic-log",
    # The current script host-interface implementation references the network
    # contract module. Keep this explicit until the runtime-api split removes
    # that compile-time dependency.
    "net-contracts",
    "runtime-api-core",
    "graphics-core",
    "platform-winit",
    "input-mouse",
    "input-keyboard",
]
runtime-shipping = ["shipping-runtime"]
shipping-editor = [
    "shipping-runtime",
    "ai-contracts",
    "net-contracts",
    "physics-contracts",
    "sound-contracts",
    "animation",
    "navigation",
    "script",
]
editor-shipping = ["shipping-editor"]
graphics = [
    "cooked-assets",
    "text",
    "dep:pollster",
    "dep:raw-window-handle",
    "dep:zr_rhi_wgpu",
]
font-sdf-build-tool = ["graphics"]
navigation = ["native-host"]
script = ["native-host", "diagnostic-log", "net-contracts"]
text = [
    "cooked-assets",
    "dep:fdsm",
    "dep:fdsm-ttf-parser",
    "dep:glyphon",
    "dep:icu_locale_core",
    "dep:icu_properties",
    "dep:nalgebra",
    "dep:naga",
    "dep:rustybuzz",
    "dep:self_cell",
    "dep:swash",
    "dep:sys-locale",
    "dep:ttf-parser",
    "dep:unicode-linebreak",
    "dep:unicode-bidi",
    "dep:unicode-bidi-mirroring",
    "dep:unicode-normalization",
    "dep:unicode-properties",
    "dep:unicode-script",
    "dep:unicode-segmentation",
    "dep:unicode-vo",
    "dep:wgpu",
    "dep:woff2-patched",
    "zr_dev_deps_dylib?/naga",
    "zr_dev_deps_dylib?/wgpu",
]
ui = ["graphics", "dep:taffy", "dep:zeroize"]
accessibility-accesskit = ["dep:accesskit"]
profiling = ["zr_resource/profiling"]
profiling-chrome = ["profiling"]
profiling-tracy = ["profiling", "dep:tracing-subscriber", "dep:tracing-tracy"]
profiling-memory = ["profiling"]
default-platform = [
    "native-host",
    "platform-window",
    "platform-winit",
    "platform-x11",
    "platform-wayland",
    "input-mouse",
    "input-keyboard",
    "input-touch",
    "input-gamepad",
    "gamepad-gilrs",
]
platform-window = []
platform-winit = [
    "platform-window",
    "dep:winit",
    "zr_rhi/platform-winit",
    "zr_rhi_wgpu?/platform-winit",
]
platform-headless = []
platform-x11 = ["platform-winit", "winit/x11"]
platform-wayland = ["platform-winit", "winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita"]
platform-android-game-activity = ["platform-winit", "winit/android-game-activity"]
platform-android-native-activity = ["platform-winit", "winit/android-native-activity"]
platform-web = ["platform-window", "platform-winit"]
input-mouse = []
input-keyboard = []
input-touch = []
input-gestures = []
input-gamepad = []
gamepad-gilrs = ["input-gamepad"]
gamepad-browser = ["input-gamepad"]
target-web = ["core-min", "asset-types", "cooked-assets", "animation", "graphics", "text", "ui", "input-mouse", "input-keyboard", "input-touch"]

target-client = [
    "core-min",
    "ai-contracts",
    "net-contracts",
    "physics-contracts",
    "sound-contracts",
    "animation",
    "diagnostic-log",
    "dynamic-api",
    "graphics",
    "navigation",
    "script",
    "text",
    "ui",
    "default-platform",
]
target-server = [
    "core-min",
    "native-host",
    "diagnostic-log",
    "platform-headless",
    "dep:naga",
    "zr_dev_deps_dylib?/naga",
]
target-editor-host = [
    "core-min",
    "ai-contracts",
    "net-contracts",
    "physics-contracts",
    "sound-contracts",
    "animation",
    "diagnostic-log",
    "dynamic-api",
    "graphics",
    "navigation",
    "script",
    "text",
    "ui",
    "default-platform",
]

[dependencies]
web-time = "1.1.0"
accesskit = { version = "0.22.0", default-features = false, optional = true }
arc-swap.workspace = true
base64 = { version = "0.22.1", optional = true }
bevy_mikktspace = { workspace = true, optional = true }
blake3.workspace = true
bytemuck.workspace = true
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde"], optional = true }
crossbeam-channel.workspace = true
crossbeam-utils = "0.8.21"
fdsm = { version = "0.8.0", optional = true }
fdsm-ttf-parser = { version = "0.2.0", optional = true }
glam.workspace = true
gltf = { workspace = true, optional = true }
glyphon = { version = "0.11.0", optional = true }
icu_locale_core = { version = "=2.2.0", features = ["alloc"], optional = true }
icu_properties = { version = "=2.2.0", optional = true }
image.workspace = true
naga = { workspace = true, optional = true }
nalgebra = { version = "0.34.1", optional = true }
pollster = { workspace = true, optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
rayon = "1.11.0"
robust = "1.2.0"
ron = { version = "0.12.1", optional = true }
rustybuzz = { version = "0.20.1", optional = true }
same-file = { version = "1.0.6", optional = true }
serde.workspace = true
serde_json = "1.0.149"
self_cell = { workspace = true, optional = true }
sha2.workspace = true
swash = { version = "0.2.10", optional = true }
sys-locale = { version = "0.3.2", optional = true }
taffy = { version = "0.10", default-features = false, features = ["std", "block_layout", "flexbox", "grid", "content_size", "taffy_tree"], optional = true }
tobj = { workspace = true, optional = true }
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.20", optional = true }
tracing-tracy = { version = "0.11.4", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
unicode-linebreak = { version = "=0.1.5", optional = true }
unicode-bidi = { version = "=0.3.18", optional = true }
unicode-bidi-mirroring = { version = "=0.4.0", optional = true }
unicode-normalization = { version = "=0.1.25", optional = true }
unicode-properties = { version = "=0.1.4", default-features = false, features = ["emoji", "general-category"], optional = true }
unicode-script = { version = "=0.5.8", optional = true }
unicode-segmentation = { version = "=1.13.3", optional = true }
unicode-vo = { version = "=0.1.0", optional = true }
uuid.workspace = true
wgpu = { workspace = true, optional = true }
winit = { workspace = true, default-features = false, optional = true }
woff2-patched = { version = "0.4.0", optional = true }
libm = "0.2.16"
zeroize = { version = "1.8.2", optional = true }
zip = { version = "9.0.0-pre2", default-features = false, features = ["deflate-flate2"], optional = true }
zircon_runtime_interface = { path = "../zircon_runtime_interface" }
zircon_reflect_derive.workspace = true
zircon_runtime_reflection_macros = { path = "reflection_macros" }
zr_math.workspace = true
zr_contracts.workspace = true
zr_dev_deps_dylib = { workspace = true, optional = true }
zr_resource.workspace = true
zr_rhi.workspace = true
zr_rhi_wgpu = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
goblin = { version = "0.10.7", default-features = false, features = ["std", "pe32", "pe64"], optional = true }
libloading = { version = "0.9.0", optional = true }
meshopt = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
ring = { version = "0.17.14", optional = true }
zstd = { version = "0.13.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "AbortController", "AbortSignal", "Request", "RequestInit", "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux project manifest admission needs non-following, non-blocking file opens.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[build-dependencies]
blake3.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
ttf2woff2 = { version = "0.13.1", default-features = false }
zr_resource = { workspace = true, features = ["test-support"] }
