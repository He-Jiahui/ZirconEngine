site_name: ZirconEngine 文档
site_description: ZirconEngine Rust 实时引擎的架构、模块、工作流与 API 文档
site_url: https://he-jiahui.github.io/ZirconEngine/
site_author: ZirconEngine Contributors
repo_name: He-Jiahui/ZirconEngine
repo_url: https://github.com/He-Jiahui/ZirconEngine
edit_uri: edit/main/docs/wiki/
docs_dir: docs/wiki
site_dir: site
use_directory_urls: true
strict: true
dev_addr: 127.0.0.1:8000

hooks:
  - tools/wiki_mkdocs_hook.py

theme:
  name: material
  language: zh
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

extra:
  generator: ZirconEngine Wiki
  wiki_source: docs/wiki
