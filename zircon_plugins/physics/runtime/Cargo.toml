[package]
name = "zircon_plugin_physics_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Physics runtime plugin package for Zircon."

[features]
default = []
backend-jolt = ["dep:joltc-sys"]

[dependencies]
joltc-sys = { version = "=0.3.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
zircon_plugin_sdk = { workspace = true, features = ["runtime"] }
zircon_runtime = { workspace = true, features = ["physics-contracts"] }
