# 动画编辑器扩展 crate 的依赖边界；作者界面经编辑器支持包注册，运行时能力另由 runtime crate 提供。
[package]
name = "zircon_plugin_animation_editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Animation editor plugin package for Zircon."

[dependencies]
zircon_editor = { workspace = true }
zircon_plugin_animation_runtime = { path = "../runtime" }
zircon_plugin_editor_support = { path = "../../editor_support" }
zircon_plugin_sdk = { workspace = true, features = ["editor"] }
zircon_runtime = { workspace = true }
