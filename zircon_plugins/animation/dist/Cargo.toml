# 原生动态发行 crate：只打包运行时入口和 SDK ABI 导出；宿主仍按发行清单选择并校验制品。
[package]
name = "zircon_plugin_animation_dist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone native dynamic Animation plugin wrapper for Zircon."

[lib]
crate-type = ["cdylib"]

[features]
default = ["dist"]
dist = []

[dependencies]
zircon_plugin_animation_runtime = { path = "../runtime" }
zircon_plugin_sdk = { workspace = true, default-features = false, features = ["native"] }
