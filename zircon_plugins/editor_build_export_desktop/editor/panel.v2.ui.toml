[asset]
kind = "view"
id = "editor_build_export_desktop.panel"
version = 2
display_name = "Desktop Build Export"

[imports]
styles = ["res://ui/theme/editor_base.v2.ui.toml"]

[root]
node = "desktop_export_root"

[nodes.export_toolbar_title]
component = "Label"
control_id = "DesktopExportToolbarTitle"
classes = ["workbench-section-title"]
props = { text = "Desktop Export" }
layout = { width = { min = 160.0, preferred = 180.0, stretch = "Fixed" }, height = { stretch = "Stretch" } }

[nodes.export_generate_plan_button]
component = "Button"
control_id = "DesktopExportGeneratePlanButton"
classes = ["material-control", "material-button"]
props = { text = "Generate Plan", layout_padding_left = 10.0, layout_padding_right = 10.0, layout_min_height = 30.0, input_interactive = true, input_clickable = true, input_hoverable = true, input_focusable = true }
layout = { width = { min = 112.0, preferred = 124.0, max = 132.0, stretch = "Fixed" }, height = { min = 30.0, preferred = 30.0, max = 34.0, stretch = "Fixed" } }
events = [{ id = "DesktopExportWizard/GeneratePlan", event = "Click" }]

[nodes.export_start_button]
component = "Button"
control_id = "DesktopExportStartButton"
classes = ["material-control", "material-button", "primary-action"]
props = { text = "Start", layout_padding_left = 10.0, layout_padding_right = 10.0, layout_min_height = 30.0, input_interactive = true, input_clickable = true, input_hoverable = true, input_focusable = true }
layout = { width = { min = 64.0, preferred = 72.0, max = 80.0, stretch = "Fixed" }, height = { min = 30.0, preferred = 30.0, max = 34.0, stretch = "Fixed" } }
events = [{ id = "DesktopExportWizard/Start", event = "Click" }]

[nodes.export_cancel_button]
component = "Button"
control_id = "DesktopExportCancelButton"
classes = ["material-control", "material-button"]
props = { text = "Cancel", layout_padding_left = 10.0, layout_padding_right = 10.0, layout_min_height = 30.0, input_interactive = true, input_clickable = true, input_hoverable = true, input_focusable = true }
layout = { width = { min = 72.0, preferred = 80.0, max = 88.0, stretch = "Fixed" }, height = { min = 30.0, preferred = 30.0, max = 34.0, stretch = "Fixed" } }
events = [{ id = "DesktopExportWizard/Cancel", event = "Click" }]

[nodes.export_toolbar_fill]
component = "Space"
layout = { width = { stretch = "Stretch" }, height = { stretch = "Stretch" } }

[nodes.export_toolbar]
component = "HorizontalGroup"
control_id = "DesktopExportToolbar"
layout = { container = { kind = "HorizontalBox", gap = 6.0 }, width = { stretch = "Stretch" }, height = { min = 36.0, preferred = 36.0, max = 40.0, stretch = "Fixed" } }
children = [{ node = "export_toolbar_title" }, { node = "export_toolbar_fill" }, { node = "export_generate_plan_button" }, { node = "export_start_button" }, { node = "export_cancel_button" }]

[nodes.export_profiles_title]
component = "Label"
control_id = "DesktopExportProfilesTitle"
props = { text = "Profiles" }
layout = { width = { stretch = "Stretch" }, height = { min = 24.0, preferred = 24.0, max = 28.0, stretch = "Fixed" } }

[nodes.export_profile_tree]
component = "Space"
control_id = "DesktopExportProfileTree"
layout = { width = { stretch = "Stretch" }, height = { stretch = "Stretch" } }

[nodes.export_missing_inputs]
component = "Space"
control_id = "DesktopExportMissingInputs"
layout = { width = { stretch = "Stretch" }, height = { min = 88.0, preferred = 112.0, max = 156.0, stretch = "Fixed" } }

[nodes.export_profiles_panel]
component = "VerticalGroup"
control_id = "DesktopExportProfilesPanel"
classes = ["workbench-panel"]
layout = { container = { kind = "VerticalBox", gap = 6.0 }, width = { min = 220.0, preferred = 260.0, stretch = "Fixed" }, height = { stretch = "Stretch" } }
children = [{ node = "export_profiles_title" }, { node = "export_profile_tree" }, { node = "export_missing_inputs" }]

[nodes.export_pipeline_title]
component = "Label"
control_id = "DesktopExportPipelineTitle"
props = { text = "Pipeline" }
layout = { width = { stretch = "Stretch" }, height = { min = 24.0, preferred = 24.0, max = 28.0, stretch = "Fixed" } }

[nodes.export_stage_rows]
component = "Space"
control_id = "DesktopExportStageRows"
layout = { width = { stretch = "Stretch" }, height = { stretch = "Stretch" } }

[nodes.export_terminal_output]
component = "Space"
control_id = "DesktopExportTerminalOutput"
layout = { width = { stretch = "Stretch" }, height = { min = 120.0, preferred = 160.0, stretch = "Fixed" } }

[nodes.export_pipeline_panel]
component = "VerticalGroup"
control_id = "DesktopExportPipelinePanel"
classes = ["workbench-panel"]
layout = { container = { kind = "VerticalBox", gap = 6.0 }, width = { min = 360.0, preferred = 520.0, stretch = "Stretch" }, height = { stretch = "Stretch" } }
children = [{ node = "export_pipeline_title" }, { node = "export_stage_rows" }, { node = "export_terminal_output" }]

[nodes.export_report_title]
component = "Label"
control_id = "DesktopExportReportTitle"
props = { text = "Report" }
layout = { width = { stretch = "Stretch" }, height = { min = 24.0, preferred = 24.0, max = 28.0, stretch = "Fixed" } }

[nodes.export_artifact_paths]
component = "Space"
control_id = "DesktopExportArtifactPaths"
layout = { width = { stretch = "Stretch" }, height = { min = 132.0, preferred = 168.0, stretch = "Fixed" } }

[nodes.export_report_body]
component = "Space"
control_id = "DesktopExportReportBody"
layout = { width = { stretch = "Stretch" }, height = { stretch = "Stretch" } }

[nodes.export_report_panel]
component = "VerticalGroup"
control_id = "DesktopExportReportPanel"
classes = ["workbench-panel"]
layout = { container = { kind = "VerticalBox", gap = 6.0 }, width = { min = 260.0, preferred = 320.0, stretch = "Fixed" }, height = { stretch = "Stretch" } }
children = [{ node = "export_report_title" }, { node = "export_artifact_paths" }, { node = "export_report_body" }]

[nodes.desktop_export_content]
component = "HorizontalGroup"
control_id = "DesktopExportContent"
layout = { container = { kind = "HorizontalBox", gap = 6.0 }, width = { stretch = "Stretch" }, height = { stretch = "Stretch" } }
children = [{ node = "export_profiles_panel" }, { node = "export_pipeline_panel" }, { node = "export_report_panel" }]

[nodes.desktop_export_root]
component = "VerticalGroup"
control_id = "DesktopExportRoot"
classes = ["editor-shell"]
layout = { container = { kind = "VerticalBox", gap = 6.0 }, width = { stretch = "Stretch" }, height = { stretch = "Stretch" } }
children = [{ node = "export_toolbar" }, { node = "desktop_export_content" }]
