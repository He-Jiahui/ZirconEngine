[asset]
kind = "view"
id = "editor_build_export_desktop.library_embed_report"
version = 2
display_name = "Library Embed Report"

[imports]
styles = ["res://ui/theme/editor_base.v2.ui.toml"]

[root]
node = "library_embed_report_root"

[nodes.library_embed_summary]
component = "Label"
control_id = "LibraryEmbedReportSummary"
props = { text = "LibraryEmbed" }
layout = { width = { stretch = "Stretch" }, height = { min = 24.0, preferred = 24.0, max = 28.0, stretch = "Fixed" } }

[nodes.library_embed_compile_host]
component = "PropertyRow"
control_id = "LibraryEmbedCompileHost"
props = { text = "Compile Host", value = "" }
layout = { width = { stretch = "Stretch" }, height = { min = 32.0, preferred = 32.0, max = 36.0, stretch = "Fixed" } }

[nodes.library_embed_feature_matrix]
component = "Space"
control_id = "LibraryEmbedFeatureMatrix"
layout = { width = { stretch = "Stretch" }, height = { stretch = "Stretch" } }

[nodes.library_embed_bundle_status]
component = "PropertyRow"
control_id = "LibraryEmbedBundleStatus"
props = { text = "Bundle", value = "" }
layout = { width = { stretch = "Stretch" }, height = { min = 32.0, preferred = 32.0, max = 36.0, stretch = "Fixed" } }

[nodes.library_embed_diagnostics]
component = "Space"
control_id = "LibraryEmbedDiagnostics"
layout = { width = { stretch = "Stretch" }, height = { min = 96.0, preferred = 128.0, stretch = "Fixed" } }

[nodes.library_embed_report_root]
component = "VerticalGroup"
control_id = "LibraryEmbedReportRoot"
classes = ["workbench-panel"]
layout = { container = { kind = "VerticalBox", gap = 6.0 }, width = { stretch = "Stretch" }, height = { stretch = "Stretch" } }
children = [{ node = "library_embed_summary" }, { node = "library_embed_compile_host" }, { node = "library_embed_feature_matrix" }, { node = "library_embed_bundle_status" }, { node = "library_embed_diagnostics" }]
