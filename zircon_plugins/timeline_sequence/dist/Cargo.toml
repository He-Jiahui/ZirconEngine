[package]
name = "zircon_plugin_timeline_sequence_dist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Timeline sequence editor standalone distribution package for Zircon."

[lib]
crate-type = ["cdylib"]

[features]
default = ["dist"]
dist = []

[dependencies]
zircon_plugin_timeline_sequence_editor = { path = "../editor" }
zircon_plugin_sdk = { workspace = true, default-features = false, features = ["native"] }
