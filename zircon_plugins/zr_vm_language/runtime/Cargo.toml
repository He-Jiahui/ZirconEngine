[package]
name = "zircon_plugin_zr_vm_language_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZrVM language runtime backend plugin for Zircon."

[features]
default = []
real-zr-vm = ["zircon_runtime/zr-vm-real-backend"]

[dependencies]
zircon_plugin_sdk = { workspace = true, features = ["runtime"] }
zircon_runtime = { path = "../../../zircon_runtime", default-features = false }
