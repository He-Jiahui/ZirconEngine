[package]
name = "zircon_plugin_zr_vm_language_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZrVM language runtime backend plugin for Zircon."

[features]
default = []
backend-zr-vm = ["zircon_runtime/backend-zr-vm"]

[dependencies]
zircon_plugin_sdk = { workspace = true, features = ["runtime"] }
zircon_runtime = { workspace = true, features = ["net-contracts", "script"] }
zircon_runtime_interface.workspace = true

[dev-dependencies]
serde_json = "1.0.149"
