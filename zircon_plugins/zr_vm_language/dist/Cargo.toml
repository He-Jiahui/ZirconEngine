[package]
name = "zircon_plugin_zr_vm_language_dist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone native dynamic ZrVM language plugin wrapper for Zircon."

[lib]
crate-type = ["cdylib"]

[features]
default = ["dist"]
dist = []

[dependencies]
zircon_plugin_zr_vm_language_runtime = { path = "../runtime" }
zircon_plugin_sdk = { workspace = true, default-features = false, features = ["native"] }
