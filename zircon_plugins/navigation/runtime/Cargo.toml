[package]
name = "zircon_plugin_navigation_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Navigation runtime plugin package for Zircon."

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zircon_plugin_navigation_recast = { path = "../native" }
zircon_plugin_sdk = { workspace = true, features = ["runtime"] }
zircon_runtime = { workspace = true }

[dev-dependencies]
zircon_runtime = { workspace = true, features = ["navigation"] }
zircon_runtime_interface = { workspace = true }
