[package]
name = "zircon_plugin_native_dynamic_fixture_native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native dynamic ABI fixture plugin for Zircon."

[lib]
crate-type = ["cdylib"]

[features]
default = ["dist"]
dist = []
abi_unknown_version = []
abi_v2_only = []
descriptor_export_missing = []
runtime_entry_export_missing = []
required_capability_missing = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zircon_plugin_sdk = { workspace = true, default-features = false, features = ["native"] }
