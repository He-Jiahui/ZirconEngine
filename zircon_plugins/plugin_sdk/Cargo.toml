[package]
name = "zircon_plugin_sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared builder APIs for Zircon plugin packages."

[features]
default = ["runtime"]
declaration = []
runtime = ["declaration", "dep:zircon_runtime"]
editor = ["runtime", "dep:zircon_editor", "editor_contribution"]
editor_contribution = ["dep:zircon_runtime_interface"]
native = ["declaration", "dep:serde", "dep:toml", "editor_contribution"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }
toml = { version = "1.1.2", optional = true }
zircon_editor = { workspace = true, optional = true }
zircon_runtime = { workspace = true, optional = true }
zircon_runtime_interface = { workspace = true, optional = true }
