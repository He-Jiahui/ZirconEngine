[package]
name = "zircon_plugin_asset_importer_data_dist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Structured data asset importer standalone native plugin distribution for Zircon."

[lib]
crate-type = ["cdylib"]

[features]
default = ["dist"]
dist = ["zircon_plugin_sdk/native"]

[dependencies]
zircon_plugin_sdk = { workspace = true, default-features = false }
