[package]
name = "zircon_plugin_sound_ray_traced_convolution_dist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone native dynamic Sound ray-traced convolution feature provider for Zircon."

[lib]
crate-type = ["cdylib"]

[features]
default = ["dist"]
dist = []

[dependencies]
zircon_plugin_sound_ray_traced_convolution_runtime = { path = "../runtime" }
zircon_plugin_sdk = { workspace = true, default-features = false, features = ["native"] }
