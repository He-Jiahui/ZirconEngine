[package]
name = "zircon_plugin_net_http_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP runtime feature package for Zircon networking."

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }
zircon_plugin_net_runtime = { path = "../../../runtime" }
zircon_runtime = { workspace = true }

[dev-dependencies]
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
