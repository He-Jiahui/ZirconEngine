[package]
name = "zircon_plugin_net_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Network runtime plugin package for Zircon."

[dependencies]
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
zircon_plugin_sdk = { workspace = true, features = ["runtime"] }
zircon_runtime = { path = "../../../zircon_runtime", default-features = false }
