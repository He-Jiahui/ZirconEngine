[package]
name = "zircon_plugin_texture_importer_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Texture asset importer runtime plugin package for Zircon."

[dependencies]
flate2 = "1.1.9"
image = "0.25.10"
psd = "0.3.5"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
zstd = "0.13.3"
zircon_plugin_sdk = { workspace = true, features = ["runtime"] }
zircon_runtime = { workspace = true }
