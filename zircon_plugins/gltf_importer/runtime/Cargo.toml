[package]
name = "zircon_plugin_gltf_importer_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "glTF and GLB asset importer runtime plugin package for Zircon."

[dependencies]
gltf = { version = "1.4.1", features = ["KHR_texture_transform", "extensions"] }
serde_json = "1.0.149"
zircon_runtime = { path = "../../../zircon_runtime", default-features = false }

[dev-dependencies]
toml = "1.1.2"
