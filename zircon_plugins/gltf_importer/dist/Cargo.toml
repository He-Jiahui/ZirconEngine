[package]
name = "zircon_plugin_gltf_importer_dist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "glTF importer standalone native plugin distribution for Zircon."

[lib]
crate-type = ["cdylib"]

[features]
default = ["dist"]
dist = ["zircon_plugin_gltf_importer_runtime/declaration", "zircon_plugin_sdk/native"]

[dependencies]
zircon_plugin_sdk = { workspace = true, default-features = false }
zircon_plugin_gltf_importer_runtime = { path = "../runtime", default-features = false }
