[package]
name = "zircon_plugin_native_window_hosting_dist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native window hosting editor-only standalone distribution package for Zircon."

[lib]
crate-type = ["cdylib"]

[features]
default = ["dist"]
dist = ["zircon_plugin_native_window_hosting_editor/declaration"]

[dependencies]
zircon_plugin_native_window_hosting_editor = { path = "../editor", default-features = false }
zircon_plugin_sdk = { workspace = true, default-features = false, features = ["native"] }
