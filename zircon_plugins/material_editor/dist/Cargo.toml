[package]
name = "zircon_plugin_material_editor_dist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Material editor standalone distribution package for Zircon."

[lib]
crate-type = ["cdylib"]

[features]
default = ["dist"]
dist = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zircon_runtime = { workspace = true }
zircon_plugin_material_editor_editor = { path = "../editor" }
zircon_plugin_sdk = { workspace = true, default-features = false, features = ["native"] }
