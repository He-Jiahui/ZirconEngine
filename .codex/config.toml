# Service-owned executable code, metadata and authorization state stay read-only.
# Agents submit task-scoped inputs via the existing .codex/outbox write grant.
'E:/Git/ZirconEngine/.git' = "read"
'E:/Git/ZirconEngine/.jenkins' = "read"
'E:/Git/ZirconEngine/.codex/state/jenkins-coordinator' = "read"
'E:/Git/ZirconEngine/.codex/state/jenkins-pilot' = "read"
'E:/Git/ZirconEngine/.codex/state/jenkins-tray' = "read"

# Compiler products, compiler caches, scratch, exports and generated evidence.
# Jenkins and Cargo retain physical-path validation and native ownership locks.
'D:/cargo-targets/zircon-local' = "write"
'E:/cargo-targets/zircon-local' = "write"
'F:/cargo-targets/zircon-local' = "write"

# Control configuration, hooks and Git data, unlisted reference trees/worktrees,
# retired coordinator data, user directories and system temp have no write grant.
# The existing Jenkins service has its own execution boundary; task-scoped
# delegation to that verified service is explicitly authorized above.
[permissions.zircon-strict.network]
enabled = true

# Permit the local Jenkins endpoint when a network proxy is active. These host
# rules do not enable the proxy or restrict direct networking when it is off.
[permissions.zircon-strict.network.domains]
"127.0.0.1" = "allow"
"localhost" = "allow"
