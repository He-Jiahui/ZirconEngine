# Canonical ZirconEngine file-write allowlist. Paths not granted write stay read-only.
# Select zircon-strict in the desktop permissions menu for existing chats.
approval_policy = "never"
default_permissions = "zircon-strict"
allow_login_shell = false
model_reasoning_summary = "none"

[features]
hooks = true

[windows]
sandbox = "elevated"

# MCP servers and apps have independent execution boundaries.
# Re-enable an entry only after its actual filesystem writes are confined.
[mcp_servers.renderdoc]
enabled = false

[mcp_servers.cua_repl]
enabled = false

[apps._default]
enabled = false

[shell_environment_policy.set]
TEMP = 'E:/cargo-targets/zircon-local/codex-temporary'
TMP = 'E:/cargo-targets/zircon-local/codex-temporary'
TMPDIR = 'E:/cargo-targets/zircon-local/codex-temporary'
PYTHONDONTWRITEBYTECODE = '1'
PYTHONPYCACHEPREFIX = 'E:/cargo-targets/zircon-local/codex-cache/python'
PIP_CACHE_DIR = 'E:/cargo-targets/zircon-local/codex-cache/pip'
npm_config_cache = 'E:/cargo-targets/zircon-local/codex-cache/npm'
XDG_CACHE_HOME = 'E:/cargo-targets/zircon-local/codex-cache'
XDG_STATE_HOME = 'E:/cargo-targets/zircon-local/codex-state'
XDG_DATA_HOME = 'E:/cargo-targets/zircon-local/codex-data'
CARGO_HOME = 'E:/cargo-targets/zircon-local/cache/cargo-home'
CARGO_TARGET_DIR = 'E:/cargo-targets/zircon-local/win32/codex-default/target'
CARGO_BUILD_BUILD_DIR = 'E:/cargo-targets/zircon-local/win32/codex-default/build'
SCCACHE_DIR = 'E:/cargo-targets/zircon-local/cache/sccache'
RUSTC_WRAPPER = ''
RUSTC_WORKSPACE_WRAPPER = ''

[permissions.zircon-strict]
description = "ZirconEngine: only registered source, documentation, skills and zircon-local output paths are writable."
extends = ":read-only"

[permissions.zircon-strict.filesystem]
# Reading an input never grants permission to modify, move or delete it.
":root" = "read"
":minimal" = "read"
":tmpdir" = "read"
":slash_tmp" = "read"
# No :workspace_roots write grant: additional workspace/visualization roots stay read-only.

# Source, documentation, fixtures and skill directories; this is a fixed list.
'E:/Git/ZirconEngine/zircon_app/src' = "write"
'E:/Git/ZirconEngine/zircon_app/tests' = "write"
