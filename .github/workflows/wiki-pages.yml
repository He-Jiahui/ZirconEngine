name: Publish ZirconEngine Wiki

on:
  push:
    branches:
      - main
    paths:
      - docs/wiki/**
      - mkdocs.yml
      - requirements-docs.txt
      - tools/wiki_site.py
      - tools/wiki_mkdocs_hook.py
      - .github/workflows/wiki-pages.yml
  pull_request:
    paths:
      - docs/wiki/**
      - mkdocs.yml
      - requirements-docs.txt
      - tools/wiki_site.py
      - tools/wiki_mkdocs_hook.py
      - .github/workflows/wiki-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-build:
    name: Validate and build Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation toolchain
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Configure GitHub Pages metadata
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Validate Wiki source
        run: python tools/wiki_site.py validate --json

      - name: Build static site
        env:
          WIKI_SITE_URL: ${{ steps.pages.outputs.base_url }}
          WIKI_SOURCE_REVISION: ${{ github.sha }}
        run: python tools/wiki_site.py build --output site --json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    name: Deploy Wiki to GitHub Pages
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
