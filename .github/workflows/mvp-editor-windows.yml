name: MVP Editor Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: D:\ZirconBuilds\cargo-target
  MVP_EVIDENCE_ROOT: D:\ZirconBuilds\mvp-ci-results-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  mvp-editor-windows:
    name: MVP editor/runtime smoke
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Verify managed Cargo output root
        shell: pwsh
        run: |
          $managedTargetRoot = 'D:\ZirconBuilds\cargo-target'
          if ($env:CARGO_TARGET_DIR -ne $managedTargetRoot) {
            throw "MVP Windows builds require CARGO_TARGET_DIR=$managedTargetRoot; got '$env:CARGO_TARGET_DIR'."
          }
          New-Item -ItemType Directory -Force -Path $env:CARGO_TARGET_DIR | Out-Null

      - name: Prepare MVP diagnostic evidence directory
        shell: pwsh
        run: |
          if ($env:MVP_EVIDENCE_ROOT -notmatch '^D:\\ZirconBuilds\\mvp-ci-results-[0-9]+-[0-9]+$') {
            throw "MVP evidence root must be a run-bound D:\ZirconBuilds path; got '$env:MVP_EVIDENCE_ROOT'."
          }
          New-Item -ItemType Directory -Force -Path $env:MVP_EVIDENCE_ROOT | Out-Null
          @(
            "rustc: $(& rustc -Vv | Out-String)",
            "cargo: $(& cargo -V | Out-String)"
          ) | Set-Content -Encoding utf8 "$env:MVP_EVIDENCE_ROOT\environment.txt"

      - name: Build editor host binary
        shell: pwsh
        run: |
          & cargo build -p zircon_app --bin zircon_editor --no-default-features --features target-editor-host --locked 2>&1 |
            Tee-Object -FilePath "$env:MVP_EVIDENCE_ROOT\build-editor.log"
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) { exit $cargoExitCode }

      - name: Build runtime desktop binary
        shell: pwsh
        run: |
          & cargo build -p zircon_app --bin zircon_runtime --no-default-features --features target-client --locked 2>&1 |
            Tee-Object -FilePath "$env:MVP_EVIDENCE_ROOT\build-runtime.log"
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) { exit $cargoExitCode }

      - name: Test project-scoped editor automation CLI contract
        shell: pwsh
        run: |
          & cargo test -p zircon_app --lib --no-default-features --features target-editor-host --locked project_automation_ -- --test-threads=1 2>&1 |
            Tee-Object -FilePath "$env:MVP_EVIDENCE_ROOT\project-automation.log"
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) { exit $cargoExitCode }

      - name: Test F1 RenderableEmpty template contract
        shell: pwsh
        run: |
          & cargo test -p zircon_editor --lib core::project::tests::template_creation::renderable_empty_template_has_the_f2_camera_cube_and_sun_contract --locked -- --exact --test-threads=1 2>&1 |
            Tee-Object -FilePath "$env:MVP_EVIDENCE_ROOT\f1-template.log"
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) { exit $cargoExitCode }
          if (-not (Select-String -LiteralPath "$env:MVP_EVIDENCE_ROOT\f1-template.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed' -Quiet)) {
            Write-Error 'F1 exact gate did not execute exactly one passing test.'
            exit 1
          }

      - name: Test F1 regenerable asset state recovery contracts
        shell: pwsh
        run: |
          & cargo test -p zircon_editor --lib core::project::tests::template_creation::template_creation_rebuilds_regenerable_asset_state_from_source_after_deletion --locked -- --exact --test-threads=1 2>&1 |
            Tee-Object -FilePath "$env:MVP_EVIDENCE_ROOT\f1-registry-rebuild.log"
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) { exit $cargoExitCode }
          if (-not (Select-String -LiteralPath "$env:MVP_EVIDENCE_ROOT\f1-registry-rebuild.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed' -Quiet)) {
            Write-Error 'F1 registry rebuild gate did not execute exactly one passing test.'
            exit 1
          }

          & cargo test -p zircon_editor --lib core::project::tests::template_creation::template_creation_recovers_a_corrupt_persisted_registry_from_source_metadata --locked -- --exact --test-threads=1 2>&1 |
            Tee-Object -FilePath "$env:MVP_EVIDENCE_ROOT\f1-registry-corrupt.log"
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) { exit $cargoExitCode }
          if (-not (Select-String -LiteralPath "$env:MVP_EVIDENCE_ROOT\f1-registry-corrupt.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed' -Quiet)) {
            Write-Error 'F1 corrupt registry recovery gate did not execute exactly one passing test.'
            exit 1
          }

      - name: Test F2 persisted WGPU scene and input contract
        shell: pwsh
        run: |
          $env:ZR_F2_BASIC_SCENE_CAPTURE_PNG = Join-Path $env:MVP_EVIDENCE_ROOT 'f2-runtime-frame.png'
          & cargo test -p zircon_runtime --lib dynamic_api::session::tests::foundation_render::render_product_f2_persisted_basic_scene_renders_accepts_input_and_shuts_down --locked -- --exact --test-threads=1 2>&1 |
            Tee-Object -FilePath "$env:MVP_EVIDENCE_ROOT\f2-runtime.log"
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) {
            Write-Error 'WGPU adapter unavailable or F2 MVP scene/render/input contract failed; blank captures are never accepted.'
            exit $cargoExitCode
          }
          if (-not (Select-String -LiteralPath "$env:MVP_EVIDENCE_ROOT\f2-runtime.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed' -Quiet)) {
            Write-Error 'F2 exact gate did not execute exactly one passing test.'
            exit 1
          }

      - name: Test F3 persisted project roundtrip
        shell: pwsh
        run: |
          & cargo test -p zircon_editor --lib tests::workbench::project::document_roundtrip::editor_project_document_roundtrips_world_and_workspace --locked -- --exact --test-threads=1 2>&1 |
            Tee-Object -FilePath "$env:MVP_EVIDENCE_ROOT\f3-persistence.log"
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) { exit $cargoExitCode }
          if (-not (Select-String -LiteralPath "$env:MVP_EVIDENCE_ROOT\f3-persistence.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed' -Quiet)) {
            Write-Error 'F3 exact gate did not execute exactly one passing test.'
            exit 1
          }

      - name: Test F4 application authoring restart contract
        shell: pwsh
        run: |
          & cargo test -p zircon_app --test editor_mvp_authoring --no-default-features --features target-editor-host --locked f4_project_authoring_survives_full_application_restart -- --exact --test-threads=1 2>&1 |
            Tee-Object -FilePath "$env:MVP_EVIDENCE_ROOT\f4-authoring.log"
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) { exit $cargoExitCode }
          if (-not (Select-String -LiteralPath "$env:MVP_EVIDENCE_ROOT\f4-authoring.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed' -Quiet)) {
            Write-Error 'F4 exact gate did not execute exactly one passing test.'
            exit 1
          }

      - name: Run canonical F5 profile and workspace gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\tools\mvp\MvpProductInputManifest.psm1 -Force -ErrorAction Stop
          $sourceFingerprint = Get-MvpSourceFingerprint -RepositoryRoot $PWD
          $buildEvidenceRoot = Join-Path $env:MVP_EVIDENCE_ROOT 'build'
          $buildLogRoot = Join-Path $buildEvidenceRoot 'logs'
          New-Item -ItemType Directory -Force -Path $buildLogRoot | Out-Null

          $f5CargoGateContracts = [ordered]@{
            'zircon-app-target-server' = @('check', '-p', 'zircon_app', '--no-default-features', '--features', 'target-server', '--locked')
            'zircon-app-target-client-platform' = @('check', '-p', 'zircon_app', '--bin', 'zircon_runtime', '--no-default-features', '--features', 'target-client,platform-winit,input-gamepad,gamepad-gilrs', '--locked')
            'zircon-app-target-editor-host' = @('check', '-p', 'zircon_app', '--bin', 'zircon_editor', '--no-default-features', '--features', 'target-editor-host', '--locked')
            'zircon-app-target-client-shader-pbr-viewer' = @('check', '-p', 'zircon_app', '--bin', 'zircon_shader_pbr_viewer', '--no-default-features', '--features', 'target-client,platform-winit,input-gamepad,gamepad-gilrs', '--locked')
            'zircon-runtime-target-client' = @('check', '-p', 'zircon_runtime', '--no-default-features', '--features', 'target-client', '--locked')
            'zircon-runtime-target-editor-host' = @('check', '-p', 'zircon_runtime', '--no-default-features', '--features', 'target-editor-host', '--locked')
            'zircon-runtime-target-server' = @('check', '-p', 'zircon_runtime', '--no-default-features', '--features', 'target-server', '--locked')
            'workspace-build' = @('build', '--workspace', '--locked')
            'workspace-test' = @('test', '--workspace', '--locked')
          }

          function Invoke-F5CargoGate {
            param([Parameter(Mandatory)][string]$GateId)

            if (-not $f5CargoGateContracts.Contains($GateId)) {
              throw "Unknown F5 build gate '$GateId'."
            }
            $cargoArguments = [string[]]$f5CargoGateContracts[$GateId]
            $executedCommand = 'cargo ' + ($cargoArguments -join ' ')
            $logPath = Join-Path $buildLogRoot "$GateId.log"
            $startedAt = [DateTimeOffset]::UtcNow
            & cargo @cargoArguments 2>&1 |
              Tee-Object -FilePath $logPath |
              ForEach-Object { Write-Host $_ }
            $cargoExitCode = $LASTEXITCODE
            $endedAt = [DateTimeOffset]::UtcNow
            if ($cargoExitCode -ne 0) {
              throw "F5 build gate '$GateId' failed with exit code $cargoExitCode."
            }
            return [ordered]@{
              gate_id = $GateId
              command = $executedCommand
              status = 'passed'
              started_at_utc = $startedAt.ToString('o')
              ended_at_utc = $endedAt.ToString('o')
              exit_code = $cargoExitCode
              evidence = [ordered]@{
                path = "logs/$GateId.log"
                sha256 = (Get-FileHash -LiteralPath $logPath -Algorithm SHA256).Hash
                size_bytes = (Get-Item -LiteralPath $logPath).Length
              }
            }
          }

          $profileGates = @(
            Invoke-F5CargoGate -GateId 'zircon-app-target-server'
            Invoke-F5CargoGate -GateId 'zircon-app-target-client-platform'
            Invoke-F5CargoGate -GateId 'zircon-app-target-editor-host'
            Invoke-F5CargoGate -GateId 'zircon-app-target-client-shader-pbr-viewer'
            Invoke-F5CargoGate -GateId 'zircon-runtime-target-client'
            Invoke-F5CargoGate -GateId 'zircon-runtime-target-editor-host'
            Invoke-F5CargoGate -GateId 'zircon-runtime-target-server'
          )
          $workspaceGates = @(
            Invoke-F5CargoGate -GateId 'workspace-build'
            Invoke-F5CargoGate -GateId 'workspace-test'
          )
          $profileContractSummary = [ordered]@{
            schema_version = 1
            summary_kind = 'profile-contract'
            source_fingerprint = $sourceFingerprint
            status = 'passed'
            gates = $profileGates
          }
          $workspaceSummary = [ordered]@{
            schema_version = 1
            summary_kind = 'workspace'
            source_fingerprint = $sourceFingerprint
            status = 'passed'
            gates = $workspaceGates
          }
          [IO.File]::WriteAllText(
            (Join-Path $buildEvidenceRoot 'profile-contract-summary.json'),
            ($profileContractSummary | ConvertTo-Json -Depth 8),
            [Text.UTF8Encoding]::new($false)
          )
          [IO.File]::WriteAllText(
            (Join-Path $buildEvidenceRoot 'workspace-summary.json'),
            ($workspaceSummary | ConvertTo-Json -Depth 8),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Run source-bound staged F5 product smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runIdentity = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $binaryInputRoot = Join-Path 'D:\ZirconBuilds' "mvp-product-inputs-$runIdentity"
          & .\tools\mvp\Build-MvpProductInputs.ps1 -ArtifactOutputDirectory $binaryInputRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $productInputManifest = Join-Path $binaryInputRoot 'mvp-product-inputs.json'
          $sourceFingerprint = (Get-Content -LiteralPath $productInputManifest -Raw -Encoding UTF8 | ConvertFrom-Json).source_fingerprint
          if ($sourceFingerprint -notmatch '^[0-9A-F]{64}$') {
            throw 'Managed product input manifest did not publish a valid source fingerprint.'
          }

          $buildEvidenceRoot = Join-Path $env:MVP_EVIDENCE_ROOT 'build'
          $profileContractSummaryPath = Join-Path $buildEvidenceRoot 'profile-contract-summary.json'
          $workspaceSummaryPath = Join-Path $buildEvidenceRoot 'workspace-summary.json'

          $stageJson = & .\tools\mvp\Stage-MvpProducts.ps1 `
            -ProductInputManifest $productInputManifest `
            -TemplateRoot (Join-Path $PWD 'templates\projects') `
            -EngineAssetRoot (Join-Path $PWD 'zircon_editor\assets') `
            -AuthoringAutomationRequest (Join-Path $PWD 'tools\mvp\mvp-authoring-automation.json') `
            -ReopenAutomationRequest (Join-Path $PWD 'tools\mvp\mvp-reopen-automation.json') `
            -CreateProject `
            -ProjectName 'ZirconMvpFixture' `
            -StagingRoot 'D:\ZirconBuilds' `
            -RepeatCount 2 `
            -TimeoutSeconds 90 `
            -Json
          $stage = $stageJson | ConvertFrom-Json

          $evidenceRoot = Join-Path 'D:\ZirconBuilds' "mvp-f5-evidence-$runIdentity"
          $acceptanceJson = & .\tools\mvp\Invoke-MvpAcceptance.ps1 `
            -StagingRoot $stage.staging_root `
            -EvidenceRoot $evidenceRoot `
            -ExpectedSourceFingerprint $sourceFingerprint `
            -ProfileContractSummaryPath $profileContractSummaryPath `
            -WorkspaceSummaryPath $workspaceSummaryPath `
            -RequireF5Evidence `
            -Json
          $acceptance = $acceptanceJson | ConvertFrom-Json

          $artifactRoot = Join-Path $env:MVP_EVIDENCE_ROOT 'f5-product'
          Copy-Item -LiteralPath $evidenceRoot -Destination $artifactRoot -Recurse -Force

      - name: Upload MVP diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-editor-windows-evidence
          path: ${{ env.MVP_EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 7
