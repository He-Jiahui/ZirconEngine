name: Profile Feature Contract

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  runner-availability:
    name: Self-hosted Windows runner availability
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Require an online Windows X64 runner
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: python3 -B .github/scripts/check-runner-availability.py --repository "${{ github.repository }}"

  profile-feature-contract:
    name: Profile feature contract (${{ matrix.label }})
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: runner-availability
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\profile-feature-contract-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\profile-feature-contract-${{ strategy.job-index || 0 }}\cargo-home
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\profile-feature-contract-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\profile-feature-contract-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\profile-feature-contract-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\profile-feature-contract-${{ strategy.job-index || 0 }}\target
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: zircon_app target-server
            package: zircon_app
            features: target-server
            bin: ""
          - label: zircon_app target-client-platform
            package: zircon_app
            features: target-client,platform-winit,input-gamepad,gamepad-gilrs
            bin: zircon_runtime
          - label: zircon_app target-editor-host
            package: zircon_app
            features: target-editor-host
            bin: zircon_editor
          - label: zircon_app target-client shader-pbr-viewer
            package: zircon_app
            features: target-client,platform-winit,input-gamepad,gamepad-gilrs
            bin: zircon_shader_pbr_viewer
          - label: zircon_runtime target-client
            package: zircon_runtime
            features: target-client
            bin: ""
          - label: zircon_runtime target-editor-host
            package: zircon_runtime
            features: target-editor-host
            bin: ""
          - label: zircon_runtime target-server
            package: zircon_runtime
            features: target-server
            bin: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false

      - name: Prepare physical output roots
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1 -BootstrapTemp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.1

      - name: Check profile features for ${{ matrix.label }}
        env:
          PROFILE_FEATURE_BIN: ${{ matrix.bin }}
        shell: pwsh
        run: |
          $cargoArgs = @('check', '-p', '${{ matrix.package }}')
          if ($env:PROFILE_FEATURE_BIN) { $cargoArgs += @('--bin', $env:PROFILE_FEATURE_BIN) }
          $cargoArgs += @('--no-default-features', '--features', '${{ matrix.features }}', '--locked', '--verbose')
          & ./.github/scripts/invoke-cargo-msvc.ps1 cargo @cargoArgs
          exit $LASTEXITCODE
