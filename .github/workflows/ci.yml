name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  dependency-governance:
    name: Dependency governance (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - zircon_plugins/Cargo.toml
    steps:
      - uses: actions/checkout@v5

      - name: Test dependency-governance contract
        run: python -B -m unittest tools.tests.test_frameworks_06_dependency_governance_contract -v

      - name: Check advisories, duplicate versions, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.94.1"
          manifest-path: ${{ matrix.manifest }}
          arguments: --all-features
          command: check
          command-arguments: advisories bans licenses sources

  runtime-profile-feature-matrix-plan:
    name: Runtime profile feature matrix plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.profile-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export canonical runtime profile matrix
        id: profile-matrix
        run: echo "matrix=$(python tools/runtime-profile-feature-presets.py matrix)" >> "$GITHUB_OUTPUT"

  runtime-profile-feature-matrix:
    name: Runtime profile feature (${{ matrix.profile }})
    needs: runtime-profile-feature-matrix-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-profile-feature-matrix-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies (runtime profile feature matrix)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libudev-dev \
            libinput-dev \
            libdbus-1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            xinput \
            libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check application profile preset
        run: cargo check -p zircon_app --lib --no-default-features --features "${{ matrix.cargo_feature }}" --locked --verbose

  runtime-domain-feature-matrix:
    name: Runtime additive domain (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - ai-contracts
          - animation
          - diagnostic-log
          - dynamic-api
          - graphics
          - navigation
          - net-contracts
          - physics-contracts
          - script
          - sound-contracts
          - text
          - ui
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check additive runtime domain
        run: cargo check -p zircon_runtime --lib --no-default-features --features "core-min,${{ matrix.feature }}" --locked --verbose

  rust:
    name: Rust build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux system dependencies (winit / wgpu / retained UI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libudev-dev \
            libinput-dev \
            libdbus-1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            xinput \
            libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Test convention runner
        run: python -m unittest tools.tests.test_check_conventions tools.tests.test_frameworks_06_ci_toolchain_contract -v

      - name: Run convention gates
        run: python tools/check_conventions.py --json

      - name: Build workspace
        run: cargo build --workspace --locked --verbose

      - name: Run unit tests
        run: cargo test --workspace --locked --verbose

      - name: Check plugin workspace
        run: cargo check --manifest-path zircon_plugins/Cargo.toml --workspace --locked --all-targets --verbose

      - name: Build plugin workspace
        run: cargo build --manifest-path zircon_plugins/Cargo.toml --workspace --locked --verbose

      - name: Check Rust plugin declarations, artifacts, and catalog wiring
        run: cargo run --locked -p cargo-zircon -- plugin check --root . --artifact-root zircon_plugins/target/debug

      - name: Run plugin workspace tests
        run: cargo test --manifest-path zircon_plugins/Cargo.toml --workspace --locked --verbose

  plugin-standalone-validate:
    name: Plugin standalone validate all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate standalone plugin manifests
        run: python -m tools.zircon_export plugin validate --all --repo-root . --json

  plugin-standalone-dist:
    name: Plugin standalone dist (${{ matrix.plugin_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin_id: native_dynamic_fixture
            package: zircon_plugin_native_dynamic_fixture_native
          - plugin_id: ai
            package: zircon_plugin_ai_dist
          - plugin_id: animation
            package: zircon_plugin_animation_dist
          - plugin_id: animation_graph
            package: zircon_plugin_animation_graph_dist
          - plugin_id: rendering
            package: zircon_plugin_rendering_dist
          - plugin_id: hybrid_gi
            package: zircon_plugin_hybrid_gi_dist
          - plugin_id: virtual_geometry
            package: zircon_plugin_virtual_geometry_dist
          - plugin_id: solari
            package: zircon_plugin_solari_dist
          - plugin_id: physics
            package: zircon_plugin_physics_dist
          - plugin_id: sound
            package: zircon_plugin_sound_dist
          - plugin_id: sound_ray_traced_convolution_reverb
            package: zircon_plugin_sound_ray_traced_convolution_dist
          - plugin_id: sound_timeline_animation_track
            package: zircon_plugin_sound_timeline_animation_dist
          - plugin_id: runtime_diagnostics
            package: zircon_plugin_runtime_diagnostics_dist
          - plugin_id: ui_asset_authoring
            package: zircon_plugin_ui_asset_authoring_dist
          - plugin_id: material_editor
            package: zircon_plugin_material_editor_dist
          - plugin_id: timeline_sequence
            package: zircon_plugin_timeline_sequence_dist
          - plugin_id: native_window_hosting
            package: zircon_plugin_native_window_hosting_dist
          - plugin_id: editor_build_export_desktop
            package: zircon_plugin_editor_build_export_desktop_dist
          - plugin_id: plugin_sdk_examples
            package: zircon_plugin_sdk_examples_dist
          - plugin_id: texture
            package: zircon_plugin_texture_dist
          - plugin_id: net
            package: zircon_plugin_net_dist
          - plugin_id: asset_importer.data
            package: zircon_plugin_asset_importer_data_dist
          - plugin_id: asset_importer.audio
            package: zircon_plugin_asset_importer_audio_dist
          - plugin_id: asset_importer.model
            package: zircon_plugin_asset_importer_model_dist
          - plugin_id: asset_importer.shader
            package: zircon_plugin_asset_importer_shader_dist
          - plugin_id: asset_importer.texture
            package: zircon_plugin_asset_importer_texture_dist
          - plugin_id: gltf_importer
            package: zircon_plugin_gltf_importer_dist
          - plugin_id: audio_importer
            package: zircon_plugin_audio_importer_dist
          - plugin_id: opus_importer
            package: zircon_plugin_opus_importer_dist
          - plugin_id: shader_wgsl_importer
            package: zircon_plugin_shader_wgsl_importer_dist
          - plugin_id: ui_document_importer
            package: zircon_plugin_ui_document_importer_dist
          - plugin_id: obj_importer
            package: zircon_plugin_obj_importer_dist
          - plugin_id: texture_importer
            package: zircon_plugin_texture_importer_dist
          - plugin_id: particles
            package: zircon_plugin_particles_dist
          - plugin_id: navigation
            package: zircon_plugin_navigation_dist
          - plugin_id: zr_vm_language
            package: zircon_plugin_zr_vm_language_dist
          - plugin_id: terrain
            package: zircon_plugin_terrain_dist
          - plugin_id: tilemap_2d
            package: zircon_plugin_tilemap_2d_dist
          - plugin_id: prefab_tools
            package: zircon_plugin_prefab_tools_dist
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check standalone dist package
        run: cargo check --manifest-path zircon_plugins/Cargo.toml -p ${{ matrix.package }} --no-default-features --features dist --locked --verbose

      - name: Build standalone dist package
        run: cargo build --manifest-path zircon_plugins/Cargo.toml -p ${{ matrix.package }} --no-default-features --features dist --locked --verbose

  export-platform-contract:
    name: Export platform contract (${{ matrix.export-platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        export-platform: [windows, linux, macos, android, ios, web_gpu, wasm, headless]
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies (runtime export contract)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libudev-dev \
            libinput-dev \
            libdbus-1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            xinput \
            libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check export policy for ${{ matrix.export-platform }}
        env:
          ZR_EXPORT_CONTRACT_PLATFORM: ${{ matrix.export-platform }}
        run: cargo test -p zircon_runtime platform_target_policy_matches_host_resource_and_plugin_strategy --locked --verbose
