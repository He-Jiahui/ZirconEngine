name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  source-contracts:
    name: Source and tooling contracts
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test convention runner
        run: python -B -m unittest tools.tests.test_check_conventions tools.tests.test_frameworks_06_ci_toolchain_contract -v

      - name: Test CI gate wiring
        run: python -B .github/tests/test_ci_gates_contract.py

      - name: Test Cargo test-reachability guard
        run: python -m unittest tools.tests.test_validate_cargo_test_reachability -v

      - name: Guard Cargo test reachability
        run: python tools/audits/validate_cargo_test_reachability.py --json

      - name: Test Rust test separation guard
        run: python -B -m unittest tools.tests.test_separate_rust_tests tools.tests.test_review_debt tools.tests.test_gitignore_contract -v

      - name: Guard Rust test directories
        run: python -B tools/audits/separate_rust_tests.py --check

      - name: Run convention gates
        run: >-
          python tools/audits/check_conventions.py --json
          --only docs --only guards --only exemptions --only layering

      - name: Check engine source path budget
        run: python -B -m unittest tools.tests.test_path_names -v

      - name: Audit engine source path budget
        run: python -B tools/audits/path_names.py --summary


  portable-runtime-core:
    name: Portable runtime core (Wasm)
    # CI outputs must pass the physical E: root and reparse-point guard.
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: [self-hosted, Windows, X64]
    env:
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\portable-runtime-core-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\portable-runtime-core-${{ strategy.job-index || 0 }}\cargo-home
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\portable-runtime-core-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\portable-runtime-core-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\portable-runtime-core-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\portable-runtime-core-${{ strategy.job-index || 0 }}\target
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false
      - name: Prepare physical output roots
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Rust and real Wasm standard library
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown
      - name: Guard resolved platform and text dependencies
        run: python -B tools/audits/check_runtime_dependency_boundaries.py --text
      - name: Compile portable core for the real Wasm target
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo check -p zircon_runtime --lib --no-default-features --features core-min --target wasm32-unknown-unknown --locked

  dependency-governance:
    name: Dependency governance (${{ matrix.manifest }})
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: [self-hosted, Windows, X64]
    env:
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dependency-governance-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dependency-governance-${{ strategy.job-index || 0 }}\cargo-home
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dependency-governance-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dependency-governance-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dependency-governance-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dependency-governance-${{ strategy.job-index || 0 }}\target
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - zircon_plugins/Cargo.toml
        include:
          - manifest: Cargo.toml
            output: root
          - manifest: zircon_plugins/Cargo.toml
            output: plugins
    steps:
      - uses: actions/checkout@v5
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false

      - name: Prepare physical output roots
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Rust toolchain for cargo-deny
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Test dependency-governance contract
        run: python -B -m unittest tools.tests.test_frameworks_06_dependency_governance_contract -v

      - name: Install pinned cargo-deny
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo +1.94.1 install --locked --version 0.20.2 --root "$env:CARGO_TARGET_DIR\cargo-deny" cargo-deny

      - name: Check advisories, duplicate versions, licenses, and sources
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 "$env:CARGO_TARGET_DIR\cargo-deny\bin\cargo-deny.exe" --manifest-path "${{ matrix.manifest }}" --all-features check advisories bans licenses sources

  runtime-profile-feature-matrix-plan:
    name: Runtime profile feature matrix plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.profile-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export canonical runtime profile matrix
        id: profile-matrix
        run: echo "matrix=$(python tools/analysis/validation/runtime-profile-feature-presets.py matrix)" >> "$GITHUB_OUTPUT"

  runtime-profile-feature-matrix:
    name: Runtime profile feature (${{ matrix.profile }})
    needs: runtime-profile-feature-matrix-plan
    # Compile on the Windows runner because the physical E: cargo root is required.
    # Linux-host ABI/system dependency behavior remains outside this lane's coverage.
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: [self-hosted, Windows, X64]
    env:
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-profile-feature-matrix-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-profile-feature-matrix-${{ strategy.job-index || 0 }}\cargo-home
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-profile-feature-matrix-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-profile-feature-matrix-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-profile-feature-matrix-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-profile-feature-matrix-${{ strategy.job-index || 0 }}\target
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-profile-feature-matrix-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false

      - name: Prepare physical output roots
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Check application profile preset
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo check -p zircon_app --lib --no-default-features --features "${{ matrix.cargo_feature }}" --locked --verbose

  runtime-domain-feature-matrix:
    name: Runtime additive domain (${{ matrix.feature }})
    # Compile on the Windows runner because the physical E: cargo root is required.
    # Linux-host ABI/system dependency behavior remains outside this lane's coverage.
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: [self-hosted, Windows, X64]
    env:
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-domain-feature-matrix-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-domain-feature-matrix-${{ strategy.job-index || 0 }}\cargo-home
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-domain-feature-matrix-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-domain-feature-matrix-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-domain-feature-matrix-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\runtime-domain-feature-matrix-${{ strategy.job-index || 0 }}\target
    strategy:
      fail-fast: false
      matrix:
        feature:
          - ai-contracts
          - animation
          - diagnostic-log
          - dynamic-api
          - graphics
          - navigation
          - net-contracts
          - physics-contracts
          - script
          - sound-contracts
          - text
          - ui
    steps:
      - uses: actions/checkout@v5
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false

      - name: Prepare physical output roots
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Check additive runtime domain
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo check -p zircon_runtime --lib --no-default-features --features "core-min,${{ matrix.feature }}" --locked --verbose

  rust:
    name: Rust build & test
    # This Windows lane preserves the workspace gate on the physical E: cargo root.
    # It does not claim Linux-host ABI/system dependency coverage.
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: [self-hosted, Windows, X64]
    env:
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\rust-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\rust-${{ strategy.job-index || 0 }}\cargo-home
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\rust-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\rust-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\rust-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\rust-${{ strategy.job-index || 0 }}\target
    steps:
      - uses: actions/checkout@v5
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare physical output roots
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Check runtime structure conventions
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo +1.94.1 test -p zircon_runtime --lib structure_convention --locked

      - name: Check Rust formatting
        shell: pwsh
        run: |
          $manifest = 'Cargo.toml'
          $metadataLines = & ./.github/scripts/invoke-cargo-msvc.ps1 cargo +1.94.1 metadata --manifest-path $manifest --format-version 1 --no-deps --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = ($metadataLines -join "`n") | ConvertFrom-Json
          $memberIds = @($metadata.workspace_members)
          if ($memberIds.Count -eq 0) { throw "Workspace has no members: $manifest" }
          $memberIdSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($memberId in $memberIds) {
            if (-not $memberIdSet.Add([string]$memberId)) { throw "Duplicate workspace member ID: $memberId" }
          }
          $members = @($metadata.packages | Where-Object { $memberIdSet.Contains([string]$_.id) })
          if ($members.Count -ne $memberIds.Count) { throw "Cargo metadata omitted workspace members: $manifest" }
          $names = @($members | ForEach-Object { [string]$_.name })
          $nameSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($name in $names) {
            if ([string]::IsNullOrWhiteSpace($name) -or -not $nameSet.Add($name)) { throw "Missing or duplicate workspace package name: $name" }
          }
          $fmtArguments = @('cargo', '+1.94.1', 'fmt', '--manifest-path', $manifest)
          foreach ($name in $names) { $fmtArguments += @('--package', $name) }
          $fmtArguments += @('--', '--check')
          & ./.github/scripts/invoke-cargo-msvc.ps1 @fmtArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build workspace
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo build --workspace --locked --verbose

      - name: Run unit tests
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo test --workspace --locked --verbose

      - name: Run Clippy with warnings denied
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check plugin workspace
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo check --manifest-path zircon_plugins/Cargo.toml --workspace --locked --all-targets --verbose

      - name: Fetch pinned plugin dependencies
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo fetch --manifest-path zircon_plugins/Cargo.toml --locked

      - name: Build plugin workspace
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo build --manifest-path zircon_plugins/Cargo.toml --workspace --locked --verbose

      - name: Check plugin workspace formatting
        shell: pwsh
        run: |
          $manifest = 'zircon_plugins/Cargo.toml'
          $metadataLines = & ./.github/scripts/invoke-cargo-msvc.ps1 cargo +1.94.1 metadata --manifest-path $manifest --format-version 1 --no-deps --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = ($metadataLines -join "`n") | ConvertFrom-Json
          $memberIds = @($metadata.workspace_members)
          if ($memberIds.Count -eq 0) { throw "Workspace has no members: $manifest" }
          $memberIdSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($memberId in $memberIds) {
            if (-not $memberIdSet.Add([string]$memberId)) { throw "Duplicate workspace member ID: $memberId" }
          }
          $members = @($metadata.packages | Where-Object { $memberIdSet.Contains([string]$_.id) })
          if ($members.Count -ne $memberIds.Count) { throw "Cargo metadata omitted workspace members: $manifest" }
          $names = @($members | ForEach-Object { [string]$_.name })
          $nameSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($name in $names) {
            if ([string]::IsNullOrWhiteSpace($name) -or -not $nameSet.Add($name)) { throw "Missing or duplicate workspace package name: $name" }
          }
          $fmtArguments = @('cargo', '+1.94.1', 'fmt', '--manifest-path', $manifest)
          foreach ($name in $names) { $fmtArguments += @('--package', $name) }
          $fmtArguments += @('--', '--check')
          & ./.github/scripts/invoke-cargo-msvc.ps1 @fmtArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run plugin workspace Clippy with warnings denied
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo clippy --manifest-path zircon_plugins/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Guard plugin Cargo test reachability
        run: python tools/audits/validate_cargo_test_reachability.py --manifest-path zircon_plugins/Cargo.toml --json

      - name: Check Rust plugin declarations, artifacts, and catalog wiring
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo run --locked -p cargo-zircon -- plugin check --root . --artifact-root "$env:CARGO_TARGET_DIR\debug"

      - name: Run plugin workspace tests
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo test --manifest-path zircon_plugins/Cargo.toml --workspace --locked --verbose

  scene-ecs-miri:
    name: Scene ECS storage and query (Miri)
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: [self-hosted, Windows, X64]
    env:
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\scene-ecs-miri-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\scene-ecs-miri-${{ strategy.job-index || 0 }}\cargo-home
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\scene-ecs-miri-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\scene-ecs-miri-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\scene-ecs-miri-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\scene-ecs-miri-${{ strategy.job-index || 0 }}\target
      MIRI_SYSROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\scene-ecs-miri-${{ strategy.job-index || 0 }}\sysroot
      ZIG_LOCAL_CACHE_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\scene-ecs-miri-${{ strategy.job-index || 0 }}\zig-cache\local
      ZIG_GLOBAL_CACHE_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\scene-ecs-miri-${{ strategy.job-index || 0 }}\zig-cache\global
      CC_x86_64_unknown_linux_gnu: ${{ github.workspace }}\.github\scripts\zig-cc-x86_64-unknown-linux-gnu.cmd
      CXX_x86_64_unknown_linux_gnu: ${{ github.workspace }}\.github\scripts\zig-cxx-x86_64-unknown-linux-gnu.cmd
      AR_x86_64_unknown_linux_gnu: ${{ github.workspace }}\.github\scripts\zig-ar-x86_64-unknown-linux-gnu.cmd
      RANLIB_x86_64_unknown_linux_gnu: ${{ github.workspace }}\.github\scripts\zig-ranlib-x86_64-unknown-linux-gnu.cmd
    steps:
      - uses: actions/checkout@v5
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare physical output roots
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1
      - name: Install pinned Zig Linux C/C++ cross tools
        shell: pwsh
        run: ./.github/scripts/install-zig-linux-tools.ps1
      - name: Install nightly Miri
        uses: dtolnay/rust-toolchain@nightly-2026-10-10
        with:
          components: miri
      - name: Prepare Miri sysroot for Linux cross-interpretation
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo +nightly-2026-10-10 miri setup --target x86_64-unknown-linux-gnu
      - name: Verify the prepared Miri sysroot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetLib = Join-Path $env:MIRI_SYSROOT 'lib\rustlib\x86_64-unknown-linux-gnu\lib'
          if (-not (Test-Path -LiteralPath $targetLib -PathType Container)) { throw 'Prepared Miri sysroot has no Linux target library directory.' }
          if (-not (Get-ChildItem -LiteralPath $targetLib -Filter 'libstd-*' -File | Select-Object -First 1)) { throw 'Prepared Miri sysroot has no Linux standard library artifact.' }
      - name: Interpret scene ECS component storage tests
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo +nightly-2026-10-10 miri test --target x86_64-unknown-linux-gnu -p zircon_runtime --lib --no-default-features --features native-host --locked scene::ecs::storage::component_storage::store::tests::sparse_rows_rekey_at_the_target_tick
      - name: Interpret scene ECS archetype table tests
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo +nightly-2026-10-10 miri test --target x86_64-unknown-linux-gnu -p zircon_runtime --lib --no-default-features --features native-host --locked scene::ecs::archetype::table::tests
      - name: Interpret scene ECS mutable query test
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo +nightly-2026-10-10 miri test --target x86_64-unknown-linux-gnu -p zircon_runtime --lib --no-default-features --features native-host --locked scene::tests::ecs_query_many::unsafe_custom_mutable_query_preserves_real_borrows_and_change_ticks

  render-feature-smoke:
    name: Rendering feature graph and frame smoke (${{ matrix.feature }})
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: [self-hosted, Windows, X64]
    env:
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\render-feature-smoke-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\render-feature-smoke-${{ strategy.job-index || 0 }}\cargo-home
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\render-feature-smoke-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\render-feature-smoke-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\render-feature-smoke-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\render-feature-smoke-${{ strategy.job-index || 0 }}\target
      ZIRCON_RENDERING_SMOKE_OUTPUT_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\render-feature-smoke-${{ strategy.job-index || 0 }}\target\product-frame
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: baked_lighting
            manifest: zircon_plugins/Cargo.toml
            package: zircon_plugin_rendering_baked_lighting_runtime
            args: --lib
            filter: baked_lighting_feature_executes_in_nonempty_wgpu_product_frame
          - feature: decals
            manifest: zircon_plugins/Cargo.toml
            package: zircon_plugin_rendering_decals_runtime
            args: --lib
            filter: decals_feature_executes_in_nonempty_wgpu_product_frame
          - feature: contact_shadow
            manifest: zircon_plugins/Cargo.toml
            package: zircon_plugin_rendering_contact_shadow_runtime
            args: --lib
            filter: contact_shadow_wgpu_product_capture_darkens_
          - feature: irradiance_volumes
            manifest: Cargo.toml
            package: zircon_runtime
            args: --lib --no-default-features --features graphics
            filter: render_product_af_m2_cookie_and_volume_execute_and_change_wgpu_frame
          - feature: light_cookies
            manifest: Cargo.toml
            package: zircon_runtime
            args: --lib --no-default-features --features graphics
            filter: render_product_af_m2_cookie_and_volume_execute_and_change_wgpu_frame
          - feature: oit
            manifest: Cargo.toml
            package: zircon_runtime
            args: --lib --no-default-features --features graphics
            filter: render_product_advanced_lighting_oit_three_crossing_planes_differs_from_sorted
          - feature: planar_reflections
            manifest: Cargo.toml
            package: zircon_runtime
            args: --lib --no-default-features --features graphics
            filter: render_product_planar_reflection_changes_mirror_floor_through_camera_loop
          - feature: post_process
            manifest: Cargo.toml
            package: zircon_runtime
            args: --lib --no-default-features --features graphics
            filter: render_product_post_uber_light_effects_change_final_frame
          - feature: reflection_probes
            manifest: Cargo.toml
            package: zircon_runtime
            args: --lib --no-default-features --features graphics
            filter: render_product_probe_feature_off_falls_back_to_skybox
          - feature: ssao
            manifest: Cargo.toml
            package: zircon_runtime
            args: --lib --no-default-features --features graphics
            filter: ssao_product_default_is_fail_closed_and_preserves_scene_output
          - feature: subsurface_scattering
            manifest: Cargo.toml
            package: zircon_runtime
            args: --lib --no-default-features --features graphics
            filter: render_product_sss_skin_sphere_executes_burley_indirect_pipeline
          - feature: ray_tracing_policy
            manifest: zircon_plugins/Cargo.toml
            package: zircon_plugin_rendering_ray_tracing_policy_runtime
            args: --lib
            filter: ray_tracing_policy_reports_backend_gates_and_keeps_a_real_product_frame
          - feature: shader_graph
            manifest: zircon_plugins/Cargo.toml
            package: zircon_plugin_rendering_shader_graph_runtime
            args: --lib
            filter: shader_graph_feature_executes_a_real_product_frame
          - feature: vfx_graph
            manifest: zircon_plugins/Cargo.toml
            package: zircon_plugin_rendering_vfx_graph_runtime
            args: --lib
            filter: vfx_graph_feature_executes_a_real_product_frame
          - feature: volumetric_fog
            manifest: zircon_plugins/Cargo.toml
            package: zircon_plugin_rendering_volumetric_fog_runtime
            args: --lib
            filter: smoke_volumetric_fog_executes_a_product_frame
    steps:
      - uses: actions/checkout@v5
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare physical output roots
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
      - name: Compile feature graph and execute product-frame smoke
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo test --manifest-path "${{ matrix.manifest }}" -p ${{ matrix.package }} ${{ matrix.args }} ${{ matrix.filter }} --locked
      - name: Check irradiance-volume feature wrapper
        if: matrix.feature == 'irradiance_volumes'
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo test --manifest-path zircon_plugins/Cargo.toml -p zircon_plugin_rendering_irradiance_volumes_runtime --lib irradiance_volume_feature_is_optional_and_registers_binding_executor --locked
      - name: Check light-cookie feature wrapper
        if: matrix.feature == 'light_cookies'
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo test --manifest-path zircon_plugins/Cargo.toml -p zircon_plugin_rendering_light_cookies_runtime --lib light_cookie_feature_is_optional_and_registers_atlas_executor --locked
      - name: Check subsurface-scattering feature wrapper
        if: matrix.feature == 'subsurface_scattering'
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo test --manifest-path zircon_plugins/Cargo.toml -p zircon_plugin_rendering_subsurface_scattering_runtime --lib sss_feature_registers_three_passes_executors_and_shading_model --locked

