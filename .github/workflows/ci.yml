name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Explicit read-only archive input; external CI provisioning remains required.
  CI_DOCS_HISTORY_ARCHIVE_ROOT: ${{ vars.ZIRCON_DOCS_HISTORY_ARCHIVE_ROOT }}

jobs:
  runner-availability:
    name: Self-hosted Windows runner availability
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Require an online Windows X64 runner
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: python3 -B .github/scripts/check-runner-availability.py --repository "${{ github.repository }}"

  editor-compile-gate:
    name: editor-compile-gate
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      ZR_CI_OUTPUT_ROOT: D:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\e-0
      CARGO_HOME: D:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\e-0\c
      RUSTUP_HOME: D:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\e-0\rustup
      CARGO_TARGET_DIR: D:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\e-0\target
      CARGO_BUILD_BUILD_DIR: D:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\e-0\build
      TEMP: D:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\e-0\tmp
      TMP: D:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\e-0\tmp
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false
      - name: Require physical managed Cargo volume
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1 -StorageRoot 'D:\cargo-targets\zircon-local' -BootstrapTemp
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.1
      - name: Record hosted runner and compiler
        shell: pwsh
        run: |
          "runner_image: $env:ImageOS/$env:ImageVersion"
          rustc -Vv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test MSVC wrapper native argument forwarding
        shell: pwsh
        run: python -B .github/tests/test_msvc_wrapper_arguments.py
      - name: Compile the complete editor feature closure
        id: editor_check
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo check -p zircon_app --bin zircon_editor --no-default-features --features target-editor-host --locked
      - name: Compile the plugin workspace
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo check --manifest-path zircon_plugins/Cargo.toml --workspace --locked
      - name: Test script behavior bridge service admission
        if: ${{ !cancelled() && steps.editor_check.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo test --manifest-path zircon_plugins/Cargo.toml -p zircon_plugin_zr_vm_language_runtime --test behavior_bridge --locked
      - name: Test editor commands and effective keymap
        if: ${{ !cancelled() && steps.editor_check.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo test -p zircon_editor --lib core::commands --locked
      - name: Test tilemap duplicate layer admission
        if: ${{ !cancelled() && steps.editor_check.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo test --manifest-path zircon_plugins/Cargo.toml -p zircon_plugin_tilemap_2d_editor --lib tilemap_paint_stroke_rejects_budget_and_duplicate_layer_identity --locked

  source-contracts:
    name: Source and tooling contracts
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Test convention runner
        run: python -B -m unittest tools.tests.test_check_conventions tools.tests.test_frameworks_06_ci_toolchain_contract -v

      - name: Test CI gate wiring
        run: |
          python -B .github/tests/test_ci_gates_contract.py
          python -B .github/tests/test_runner_availability.py

      - name: Test editor build input boundaries
        run: python -B -m unittest tools.tests.test_editor_build_inputs -v

      - name: Test Cargo test-reachability guard
        run: python -m unittest tools.tests.test_validate_cargo_test_reachability -v

      - name: Guard Cargo test reachability
        run: python tools/audits/validate_cargo_test_reachability.py --json

      - name: Test Rust test separation guard
        run: python -B -m unittest tools.tests.test_separate_rust_tests tools.tests.test_review_debt tools.tests.test_gitignore_contract tools.tests.test_repair_doc_paths -v

      - name: Guard Rust test directories
        run: python -B tools/audits/separate_rust_tests.py --check

      - name: Run convention gates
        run: >-
          python tools/audits/check_conventions.py --json
          --only docs --only guards --only exemptions --only layering

      - name: Check engine source path budget
        run: python -B -m unittest tools.tests.test_path_names -v

      - name: Audit engine source path budget
        run: python -B tools/audits/path_names.py --summary


  portable-runtime-core:
    name: Portable runtime core (Wasm)
    # CI outputs must pass the physical E: root and reparse-point guard.
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.runtime-profile-feature-matrix-plan.outputs.has_portable == 'true'
    needs: [runner-availability, runtime-profile-feature-matrix-plan]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      CI_SCOPE_BASE: ${{ needs.runtime-profile-feature-matrix-plan.outputs.base }}
      CI_SCOPE_HEAD: ${{ needs.runtime-profile-feature-matrix-plan.outputs.head }}
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pc-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pc-${{ strategy.job-index || 0 }}\c
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pc-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pc-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pc-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pc-${{ strategy.job-index || 0 }}\target
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare physical output roots
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1 -BootstrapTemp
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install Rust and real Wasm standard library
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
      - name: Guard resolved platform and text dependencies
        run: python -B tools/audits/check_runtime_dependency_boundaries.py --text
      - name: Compile portable core for the real Wasm target
        shell: pwsh
        run: python -B .github/scripts/ci-scope.py run --base "$env:CI_SCOPE_BASE" --head "$env:CI_SCOPE_HEAD" --recipe portable-core


  dependency-governance:
    name: Dependency governance (${{ matrix.manifest }})
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: runner-availability
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dg-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dg-${{ strategy.job-index || 0 }}\c
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dg-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dg-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dg-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\dg-${{ strategy.job-index || 0 }}\target
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - zircon_plugins/Cargo.toml
        include:
          - manifest: Cargo.toml
            output: root
          - manifest: zircon_plugins/Cargo.toml
            output: plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false

      - name: Prepare physical output roots
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1 -BootstrapTemp

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install pinned Rust toolchain for cargo-deny
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.1

      - name: Test dependency-governance contract
        run: python -B -m unittest tools.tests.test_frameworks_06_dependency_governance_contract -v

      - name: Install pinned cargo-deny
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo +1.94.1 install --locked --version 0.20.2 --root "$env:CARGO_TARGET_DIR\cargo-deny" cargo-deny

      - name: Check advisories, duplicate versions, licenses, and sources
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 "$env:CARGO_TARGET_DIR\cargo-deny\bin\cargo-deny.exe" --manifest-path "${{ matrix.manifest }}" --all-features check advisories bans licenses sources

  runtime-profile-feature-matrix-plan:
    name: Affected owner recipe plan
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CI_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_SCOPE_HEAD: ${{ github.sha }}
    outputs:
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
      profile: ${{ steps.scope.outputs.profile }}
      domain: ${{ steps.scope.outputs.domain }}
      dist: ${{ steps.scope.outputs.dist }}
      render: ${{ steps.scope.outputs.render }}
      export: ${{ steps.scope.outputs.export }}
      has_profile: ${{ steps.scope.outputs.has_profile }}
      has_domain: ${{ steps.scope.outputs.has_domain }}
      has_dist: ${{ steps.scope.outputs.has_dist }}
      has_render: ${{ steps.scope.outputs.has_render }}
      has_export: ${{ steps.scope.outputs.has_export }}
      has_miri: ${{ steps.scope.outputs.has_miri }}
      has_portable: ${{ steps.scope.outputs.has_portable }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Resolve real changed owners; refuse unknown impact
        id: scope
        run: python -B .github/scripts/ci-scope.py plan --base "$CI_SCOPE_BASE" --head "$CI_SCOPE_HEAD" --github-output

  runtime-profile-feature-matrix:
    name: Affected profile contract (${{ matrix.recipe }})
    # Compile on the Windows runner because the physical E: cargo root is required.
    # Linux-host ABI/system dependency behavior remains outside this lane's coverage.
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.runtime-profile-feature-matrix-plan.outputs.has_profile == 'true'
    needs: [runner-availability, runtime-profile-feature-matrix-plan]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      CI_RECIPE: ${{ matrix.recipe }}
      CI_SCOPE_BASE: ${{ needs.runtime-profile-feature-matrix-plan.outputs.base }}
      CI_SCOPE_HEAD: ${{ needs.runtime-profile-feature-matrix-plan.outputs.head }}
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pf-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pf-${{ strategy.job-index || 0 }}\c
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pf-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pf-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pf-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\pf-${{ strategy.job-index || 0 }}\target
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-profile-feature-matrix-plan.outputs.profile) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare physical output roots
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1 -BootstrapTemp

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.1

      - name: Check application profile preset
        shell: pwsh
        run: python -B .github/scripts/ci-scope.py run --base "$env:CI_SCOPE_BASE" --head "$env:CI_SCOPE_HEAD" --recipe "$env:CI_RECIPE"


  runtime-domain-feature-matrix:
    name: Affected domain contract (${{ matrix.recipe }})
    # Compile on the Windows runner because the physical E: cargo root is required.
    # Linux-host ABI/system dependency behavior remains outside this lane's coverage.
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.runtime-profile-feature-matrix-plan.outputs.has_domain == 'true'
    needs: [runner-availability, runtime-profile-feature-matrix-plan]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      CI_RECIPE: ${{ matrix.recipe }}
      CI_SCOPE_BASE: ${{ needs.runtime-profile-feature-matrix-plan.outputs.base }}
      CI_SCOPE_HEAD: ${{ needs.runtime-profile-feature-matrix-plan.outputs.head }}
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\df-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\df-${{ strategy.job-index || 0 }}\c
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\df-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\df-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\df-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\df-${{ strategy.job-index || 0 }}\target
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-profile-feature-matrix-plan.outputs.domain) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare physical output roots
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1 -BootstrapTemp

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.1

      - name: Check additive runtime domain
        shell: pwsh
        run: python -B .github/scripts/ci-scope.py run --base "$env:CI_SCOPE_BASE" --head "$env:CI_SCOPE_HEAD" --recipe "$env:CI_RECIPE"


  rust:
    name: Rust build & test
    # Metadata enumerates all members for formatting only; compilation consumes affected recipes.
    # It does not claim Linux-host ABI/system dependency coverage.
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [runner-availability, runtime-profile-feature-matrix-plan]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      CI_SCOPE_BASE: ${{ needs.runtime-profile-feature-matrix-plan.outputs.base }}
      CI_SCOPE_HEAD: ${{ needs.runtime-profile-feature-matrix-plan.outputs.head }}
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\r-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\r-${{ strategy.job-index || 0 }}\c
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\r-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\r-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\r-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\r-${{ strategy.job-index || 0 }}\target
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Prepare physical output roots
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1 -BootstrapTemp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy



      - name: Check Rust formatting
        shell: pwsh
        run: |
          $manifest = 'Cargo.toml'
          $metadataLines = & ./.github/scripts/invoke-cargo-msvc.ps1 cargo +1.94.1 metadata --manifest-path $manifest --format-version 1 --no-deps --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = ($metadataLines -join "`n") | ConvertFrom-Json
          $memberIds = @($metadata.workspace_members)
          if ($memberIds.Count -eq 0) { throw "Workspace has no members: $manifest" }
          $memberIdSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($memberId in $memberIds) {
            if (-not $memberIdSet.Add([string]$memberId)) { throw "Duplicate workspace member ID: $memberId" }
          }
          $members = @($metadata.packages | Where-Object { $memberIdSet.Contains([string]$_.id) })
          if ($members.Count -ne $memberIds.Count) { throw "Cargo metadata omitted workspace members: $manifest" }
          $names = @($members | ForEach-Object { [string]$_.name })
          $nameSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($name in $names) {
            if ([string]::IsNullOrWhiteSpace($name) -or -not $nameSet.Add($name)) { throw "Missing or duplicate workspace package name: $name" }
          }
          $fmtArguments = @('cargo', '+1.94.1', 'fmt', '--manifest-path', $manifest)
          foreach ($name in $names) { $fmtArguments += @('--package', $name) }
          $fmtArguments += @('--', '--check')
          & ./.github/scripts/invoke-cargo-msvc.ps1 @fmtArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch pinned plugin dependencies
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo fetch --manifest-path zircon_plugins/Cargo.toml --locked


      - name: Check plugin workspace formatting
        shell: pwsh
        run: |
          $manifest = 'zircon_plugins/Cargo.toml'
          $metadataLines = & ./.github/scripts/invoke-cargo-msvc.ps1 cargo +1.94.1 metadata --manifest-path $manifest --format-version 1 --no-deps --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = ($metadataLines -join "`n") | ConvertFrom-Json
          $memberIds = @($metadata.workspace_members)
          if ($memberIds.Count -eq 0) { throw "Workspace has no members: $manifest" }
          $memberIdSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($memberId in $memberIds) {
            if (-not $memberIdSet.Add([string]$memberId)) { throw "Duplicate workspace member ID: $memberId" }
          }
          $members = @($metadata.packages | Where-Object { $memberIdSet.Contains([string]$_.id) })
          if ($members.Count -ne $memberIds.Count) { throw "Cargo metadata omitted workspace members: $manifest" }
          $names = @($members | ForEach-Object { [string]$_.name })
          $nameSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($name in $names) {
            if ([string]::IsNullOrWhiteSpace($name) -or -not $nameSet.Add($name)) { throw "Missing or duplicate workspace package name: $name" }
          }
          $fmtArguments = @('cargo', '+1.94.1', 'fmt', '--manifest-path', $manifest)
          foreach ($name in $names) { $fmtArguments += @('--package', $name) }
          $fmtArguments += @('--', '--check')
          & ./.github/scripts/invoke-cargo-msvc.ps1 @fmtArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Guard plugin Cargo test reachability
        run: python tools/audits/validate_cargo_test_reachability.py --manifest-path zircon_plugins/Cargo.toml --json

      # Dist recipes fail closed: the legacy artifact CLI has no per-plugin selector.
      # Standalone manifest validation is retained; it is not native artifact acceptance.


      - name: Test and lint affected owner libraries
        shell: pwsh
        run: python -B .github/scripts/ci-scope.py run --base "$env:CI_SCOPE_BASE" --head "$env:CI_SCOPE_HEAD" --group rust

  scene-ecs-miri:
    name: Scene ECS storage and query (Miri)
    # Persistent runners execute only trusted branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.runtime-profile-feature-matrix-plan.outputs.has_miri == 'true'
    needs: [runner-availability, runtime-profile-feature-matrix-plan]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      CI_SCOPE_BASE: ${{ needs.runtime-profile-feature-matrix-plan.outputs.base }}
      CI_SCOPE_HEAD: ${{ needs.runtime-profile-feature-matrix-plan.outputs.head }}
      ZR_CI_OUTPUT_ROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\mi-${{ strategy.job-index || 0 }}
      CARGO_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\mi-${{ strategy.job-index || 0 }}\c
      RUSTUP_HOME: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\mi-${{ strategy.job-index || 0 }}\rustup
      TEMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\mi-${{ strategy.job-index || 0 }}\tmp
      TMP: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\mi-${{ strategy.job-index || 0 }}\tmp
      CARGO_TARGET_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\mi-${{ strategy.job-index || 0 }}\target
      MIRI_SYSROOT: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\mi-${{ strategy.job-index || 0 }}\sysroot
      ZIG_LOCAL_CACHE_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\mi-${{ strategy.job-index || 0 }}\zig-cache\local
      ZIG_GLOBAL_CACHE_DIR: E:\cargo-targets\zircon-local\ci\runs\${{ github.run_id }}-${{ github.run_attempt }}\mi-${{ strategy.job-index || 0 }}\zig-cache\global
      CC_x86_64_unknown_linux_gnu: ${{ github.workspace }}\.github\scripts\zig-cc-x86_64-unknown-linux-gnu.cmd
      CXX_x86_64_unknown_linux_gnu: ${{ github.workspace }}\.github\scripts\zig-cxx-x86_64-unknown-linux-gnu.cmd
      AR_x86_64_unknown_linux_gnu: ${{ github.workspace }}\.github\scripts\zig-ar-x86_64-unknown-linux-gnu.cmd
      RANLIB_x86_64_unknown_linux_gnu: ${{ github.workspace }}\.github\scripts\zig-ranlib-x86_64-unknown-linux-gnu.cmd
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Prepare physical output roots
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: ./.github/scripts/prepare-cargo-roots.ps1 -BootstrapTemp
      - name: Install pinned Zig Linux C/C++ cross tools
        shell: pwsh
        run: ./.github/scripts/install-zig-linux-tools.ps1
      - name: Install nightly Miri
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-10-10
          components: miri
      - name: Prepare Miri sysroot for Linux cross-interpretation
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 cargo +nightly-2026-10-10 miri setup --target x86_64-unknown-linux-gnu
      - name: Verify the prepared Miri sysroot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetLib = Join-Path $env:MIRI_SYSROOT 'lib\rustlib\x86_64-unknown-linux-gnu\lib'
          if (-not (Test-Path -LiteralPath $targetLib -PathType Container)) { throw 'Prepared Miri sysroot has no Linux target library directory.' }
          if (-not (Get-ChildItem -LiteralPath $targetLib -Filter 'libstd-*' -File | Select-Object -First 1)) { throw 'Prepared Miri sysroot has no Linux standard library artifact.' }
      - name: Interpret scene ECS component storage tests
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo +nightly-2026-10-10 miri test --target x86_64-unknown-linux-gnu -p zircon_runtime --lib --no-default-features --features native-host --locked scene::ecs::storage::component_storage::store::tests::sparse_rows_rekey_at_the_target_tick
      - name: Interpret scene ECS archetype table tests
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo +nightly-2026-10-10 miri test --target x86_64-unknown-linux-gnu -p zircon_runtime --lib --no-default-features --features native-host --locked scene::ecs::archetype::table::tests
      - name: Interpret scene ECS mutable query test
        shell: pwsh
        run: ./.github/scripts/invoke-cargo-msvc.ps1 -RequireMatchingTests cargo +nightly-2026-10-10 miri test --target x86_64-unknown-linux-gnu -p zircon_runtime --lib --no-default-features --features native-host --locked scene::tests::ecs_query_many::unsafe_custom_mutable_query_preserves_real_borrows_and_change_ticks

