[package]
name = "woc_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Project-local native host adapter for the WOC ZrVM package."

[features]
default = []
backend-zr-vm = ["dep:zr_vm_rust_binding", "dep:zr_vm_rust_binding_sys"]
engine-host = ["backend-zr-vm", "dep:zircon_runtime", "dep:zircon_plugin_zr_vm_language_runtime"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
woc_protocol.workspace = true
zircon_runtime = { workspace = true, optional = true }
zircon_plugin_zr_vm_language_runtime = { workspace = true, optional = true }
zr_vm_rust_binding = { workspace = true, optional = true }
zr_vm_rust_binding_sys = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
