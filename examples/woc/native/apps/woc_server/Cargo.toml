[package]
name = "woc_server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WOC authoritative server role bootstrap."

[features]
default = ["engine-host"]
engine-host = ["woc_runtime/engine-host"]

[[bin]]
name = "woc_server"
path = "src/main.rs"
required-features = ["engine-host"]

[dependencies]
serde_json.workspace = true
woc_protocol.workspace = true
woc_runtime.workspace = true

[dev-dependencies]
tempfile.workspace = true
