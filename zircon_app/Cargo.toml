[package]
name = "zircon_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine entry bootstrap, shell startup, and profile selection."
autobins = false
build = "build.rs"

[[bin]]
name = "zircon_editor"
path = "src/bin/editor.rs"
required-features = ["target-editor-host"]

[[bin]]
name = "zircon_runtime"
path = "src/bin/runtime_preview.rs"
required-features = ["target-client"]

[[bin]]
name = "zircon_shader_pbr_viewer"
path = "src/bin/zircon_shader_pbr_viewer/main.rs"
required-features = ["target-client"]

[features]
default = ["target-client"]
core-min = ["zircon_runtime/core-min"]
ai-contracts = ["zircon_runtime/ai-contracts"]
net-contracts = ["zircon_runtime/net-contracts"]
physics-contracts = ["zircon_runtime/physics-contracts"]
sound-contracts = ["zircon_runtime/sound-contracts"]
animation = ["zircon_runtime/animation"]
diagnostic-log = ["zircon_runtime/diagnostic-log"]
dynamic-api = [
    "animation",
    "diagnostic-log",
    "graphics",
    "navigation",
    "script",
    "ui",
    "zircon_runtime/dynamic-api",
]
graphics = ["text", "zircon_runtime/graphics"]
navigation = ["zircon_runtime/navigation"]
script = ["diagnostic-log", "zircon_runtime/script"]
text = ["zircon_runtime/text"]
ui = ["graphics", "zircon_runtime/ui"]
first-party-runtime-plugins = [
    "dep:zircon_first_party_runtime_catalog",
    "zircon_first_party_runtime_catalog/base-runtime-plugins",
]
first-party-advanced-render-runtime-plugins = [
    "dep:zircon_first_party_runtime_catalog",
    "zircon_first_party_runtime_catalog/advanced-render-runtime-plugins",
]
first-party-navigation-runtime-plugin = [
    "dep:zircon_first_party_runtime_catalog",
    "zircon_first_party_runtime_catalog/navigation-runtime-plugin",
]
first-party-editor-catalog = [
    "dep:zircon_editor",
    "dep:zircon_first_party_editor_catalog",
]
first-party-navigation-editor-plugin = [
    "first-party-editor-catalog",
    "zircon_first_party_editor_catalog/navigation-editor-plugin",
]
first-party-neural-editor-plugin = [
    "first-party-editor-catalog",
    "zircon_first_party_editor_catalog/neural-editor-plugin",
]
first-party-zr-vm-language-runtime-plugin = [
    "dep:zircon_first_party_runtime_catalog",
    "zircon_first_party_runtime_catalog/zr-vm-language-runtime-plugin",
]
backend-zr-vm = [
    "first-party-zr-vm-language-runtime-plugin",
    "zircon_first_party_runtime_catalog/backend-zr-vm",
]
default-platform = [
    "zircon_runtime/default-platform",
    "platform-window",
    "platform-winit",
    "platform-x11",
    "platform-wayland",
    "input-mouse",
    "input-keyboard",
    "input-touch",
    "input-gamepad",
    "gamepad-gilrs",
]
platform-window = ["zircon_runtime/platform-window", "dep:softbuffer"]
platform-winit = ["platform-window", "zircon_runtime/platform-winit", "dep:winit"]
platform-headless = ["zircon_runtime/platform-headless"]
platform-x11 = ["platform-winit", "zircon_runtime/platform-x11", "winit/x11"]
platform-wayland = ["platform-winit", "zircon_runtime/platform-wayland", "winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita"]
platform-android-game-activity = ["platform-winit", "zircon_runtime/platform-android-game-activity", "winit/android-game-activity"]
platform-android-native-activity = ["platform-winit", "zircon_runtime/platform-android-native-activity", "winit/android-native-activity"]
platform-web = ["platform-winit", "zircon_runtime/platform-web"]
input-mouse = ["zircon_runtime/input-mouse"]
input-keyboard = ["zircon_runtime/input-keyboard"]
input-touch = ["zircon_runtime/input-touch"]
input-gestures = ["zircon_runtime/input-gestures"]
input-gamepad = ["zircon_runtime/input-gamepad"]
gamepad-gilrs = ["zircon_runtime/gamepad-gilrs", "dep:gilrs"]
gamepad-browser = ["zircon_runtime/gamepad-browser", "input-gamepad"]
profiling = ["zircon_runtime/profiling", "zircon_editor?/profiling"]
profiling-chrome = ["profiling", "zircon_runtime/profiling-chrome", "zircon_editor?/profiling-chrome"]
profiling-tracy = ["profiling", "zircon_runtime/profiling-tracy", "zircon_editor?/profiling-tracy"]
profiling-memory = ["profiling", "zircon_runtime/profiling-memory", "zircon_editor?/profiling-memory"]
target-client = [
    "zircon_runtime/target-client",
    "ai-contracts",
    "net-contracts",
    "physics-contracts",
    "sound-contracts",
    "animation",
    "diagnostic-log",
    "dynamic-api",
    "graphics",
    "navigation",
    "script",
    "text",
    "ui",
    "default-platform",
]
target-server = [
    "zircon_runtime/target-server",
    "diagnostic-log",
    "platform-headless",
]
target-editor-host = [
    "zircon_runtime/target-editor-host",
    "first-party-advanced-render-runtime-plugins",
    "first-party-navigation-runtime-plugin",
    "first-party-navigation-editor-plugin",
    "first-party-neural-editor-plugin",
    "ai-contracts",
    "net-contracts",
    "physics-contracts",
    "sound-contracts",
    "animation",
    "diagnostic-log",
    "dynamic-api",
    "graphics",
    "navigation",
    "script",
    "text",
    "ui",
    "dep:zircon_editor",
    "default-platform",
]

[dependencies]
libloading = "0.9.0"
serde.workspace = true
serde_json = "1.0.149"
sha2.workspace = true
tracing.workspace = true
gilrs = { version = "0.11.0", optional = true }
image.workspace = true
softbuffer = { version = "0.4.6", optional = true }
toml.workspace = true
winit = { workspace = true, default-features = false, optional = true }
zircon_editor = { path = "../zircon_editor", optional = true }
zircon_first_party_editor_catalog = { path = "../zircon_plugins/first_party_editor_catalog", optional = true, default-features = false }
zircon_first_party_runtime_catalog = { path = "../zircon_plugins/first_party_runtime_catalog", optional = true, default-features = false }
zircon_runtime = { path = "../zircon_runtime", default-features = false }
zircon_runtime_host.workspace = true
zircon_runtime_interface = { path = "../zircon_runtime_interface" }
