[advisories]
# Security and soundness advisories are never silently waived. Add an entry only with a reviewed,
# time-bounded remediation record.
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    { crate = "audio_thread_priority", allow = ["MPL-2.0"] },
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    { crate = "symphonia", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-flac", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-mp3", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-pcm", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-vorbis", allow = ["MPL-2.0"] },
    { crate = "symphonia-common", allow = ["MPL-2.0"] },
    { crate = "symphonia-core", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-ogg", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-riff", allow = ["MPL-2.0"] },
    { crate = "symphonia-metadata", allow = ["MPL-2.0"] },
    { crate = "symphonia-utils-xiph", allow = ["MPL-2.0"] },
    { crate = "triple_buffer", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = false
registries = []

[bans]
# Existing transitive duplication is visible debt, while new wildcard requirements are rejected.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
