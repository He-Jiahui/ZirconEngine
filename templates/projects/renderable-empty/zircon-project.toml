name = "ZirconProject"
format_version = 3
default_scene = "res://scenes/main.scene.toml"
asset_roots = ["assets"]
library_version = 1

[plugins]

[[plugins.selections]]
id = "rendering"
enabled = true
required = true
target_modes = ["editor_host", "client_runtime"]
packaging = "library_embed"
runtime_crate = "zircon_plugin_rendering_runtime"

[[plugins.selections]]
id = "obj_importer"
enabled = true
required = true
target_modes = ["editor_host", "client_runtime"]
packaging = "library_embed"
runtime_crate = "zircon_plugin_obj_importer_runtime"

[[plugins.selections]]
id = "shader_wgsl_importer"
enabled = true
required = true
target_modes = ["editor_host", "client_runtime"]
packaging = "library_embed"
runtime_crate = "zircon_plugin_shader_wgsl_importer_runtime"

[export_profiles.desktop_windows]
target_mode = "client_runtime"
platform = "windows"
path = ["source_template", "library_embed", "native_dynamic"]
mode = "release"
