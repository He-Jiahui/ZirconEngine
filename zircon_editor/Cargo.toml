[package]
name = "zircon_editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Editor shell, tools, and Rust-owned workbench UI host contracts."
build = "build.rs"

[dependencies]
arc-swap.workspace = true
blake3.workspace = true
crossbeam-channel.workspace = true
gltf.workspace = true
image.workspace = true
indexmap = "2.14.0"
notify.workspace = true
rectangle-pack.workspace = true
resvg = "0.47.0"
serde.workspace = true
serde_json = { version = "1.0.149", features = ["raw_value"] }
softbuffer = "0.4.6"
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
unicode-segmentation = "1.13.2"
uuid.workspace = true
winit.workspace = true
zircon_runtime = { path = "../zircon_runtime", default-features = false, features = ["target-editor-host"] }
zircon_runtime_host.workspace = true
zircon_runtime_interface = { path = "../zircon_runtime_interface" }
zr_runtime_dev_dylib = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
crossbeam-channel.workspace = true
zircon_runtime = { path = "../zircon_runtime", default-features = false, features = ["test-support"] }

[build-dependencies]
toml.workspace = true

[features]
default = []
dev-dynamic-linking = ["dep:zr_runtime_dev_dylib", "zr_runtime_dev_dylib/runtime"]
integration-contracts = []
profiling = ["zircon_runtime/profiling"]
profiling-chrome = ["profiling", "zircon_runtime/profiling-chrome"]
profiling-tracy = ["profiling", "zircon_runtime/profiling-tracy"]
profiling-memory = ["profiling", "zircon_runtime/profiling-memory"]

[[bin]]
name = "zircon_editor_zui_capture"
path = "src/bin/zircon_editor_zui_capture.rs"

[[test]]
name = "integration_contracts"
path = "tests/integration_contracts.rs"
required-features = ["integration-contracts"]
