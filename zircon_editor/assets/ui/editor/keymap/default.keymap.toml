[bindings]
"editor.command.palette" = "Ctrl+Shift+P"
"file.scene.create" = "Ctrl+N"
"file.scene.open" = "Ctrl+O"
"file.project.save" = "Ctrl+S"
"file.documents.save_all" = "Ctrl+Shift+S"
"edit.history.undo" = "Ctrl+Z"
"edit.history.redo" = "Ctrl+Shift+Z"
"scene.node.duplicate_selected" = "Ctrl+D"
"scene.node.delete_selected" = "Delete"
"runtime.play_mode.enter" = "Alt+P"
"runtime.play_mode.exit" = "Esc"
"window.layout.reset" = "Ctrl+Alt+0"
"viewport.selection.frame" = "F"
"viewport.tool.select" = "Q"
"viewport.tool.translate" = "W"
"viewport.tool.rotate" = "E"
"viewport.tool.scale" = "R"
"view.content_drawer.toggle" = "Ctrl+Space"
