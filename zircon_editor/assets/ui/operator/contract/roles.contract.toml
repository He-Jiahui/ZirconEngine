# Engineering owns semantics. Penpot owns operator visuals; generated assets do not edit this file.
schema_version = 1

[roles."level.shell.root"]
kind = "region"
screen = "level"
required = true

[roles."level.menu.bar"]
kind = "menu"
screen = "level"
required = true

[roles."level.dock.primary"]
kind = "dock"
screen = "level"
required = true

[roles."level.toolbar.save"]
kind = "command"
screen = "level"
required = true
command = "file.project.save"

[roles."level.toolbar.play"]
kind = "command"
screen = "level"
required = true
command = "runtime.play_mode.enter"

[roles."level.toolbar.stop"]
kind = "command"
screen = "level"
required = true
command = "runtime.play_mode.exit"

[roles."level.viewport.surface"]
kind = "slot"
screen = "level"
required = true
slot = "viewport.surface"

[roles."level.outliner.rows"]
kind = "slot"
screen = "level"
required = true
slot = "outliner.rows"

[roles."level.details.properties"]
kind = "slot"
screen = "level"
required = true
slot = "details.properties"

[roles."level.content.assets"]
kind = "slot"
screen = "level"
required = false
slot = "content.assets"

[roles."level.log.lines"]
kind = "slot"
screen = "level"
required = false
slot = "log.lines"

[roles."level.status.summary"]
kind = "status"
screen = "level"
required = true

[roles."project.browser.root"]
kind = "region"
screen = "project"
required = true

[roles."project.browser.projects"]
kind = "slot"
screen = "project"
required = true
slot = "recent.projects"

[roles."project.browser.open"]
kind = "command"
screen = "project"
required = true
command = "file.project.open"

[roles."settings.window.root"]
kind = "region"
screen = "settings"
required = true

[roles."settings.window.values"]
kind = "slot"
screen = "settings"
required = true
slot = "settings.properties"
