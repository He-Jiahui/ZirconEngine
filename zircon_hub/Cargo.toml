[package]
name = "zircon_hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone desktop launcher and install hub for ZirconEngine."
build = "build.rs"
autobins = false

[lib]
path = "src/lib.rs"
test = false

[[bin]]
name = "zircon_hub"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json = "1.0.149"
tauri = { version = "2.11.2", features = [] }
thiserror.workspace = true
toml.workspace = true
zircon_runtime_interface.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
