[workspace]

[package]
name = "zircon_session_tray"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Windows tray supervisor for the ZirconEngine Session Coordinator."
build = "build.rs"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "zircon-session-tray"
path = "src/main.rs"

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.2", features = ["tray-icon"] }
thiserror = "2.0.18"
windows = { version = "0.54.0", features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
